<!doctype html>
<!--
  ScamSquad Academy
  A free game that teaches kids aged 6 to 18 to spot online scams.

  Made by Arvin Challa.
  Version 1 was made in July 2026. This version: October 2026.

  This folder has four files:
    index.html   the page (this file)
    styles.css   how everything looks
    missions.js  the words: every mission, and the notes for grown-ups
    game.js      the code that runs the game

  Nothing here talks to a server. No accounts, no tracking, no ads.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Arvin Challa">
<meta name="description" content="A free game that teaches kids aged 6 to 18 to spot online scams. No sign-up, no tracking.">
<title>ScamSquad Academy</title>
<link rel="stylesheet" href="styles.css?v=2026-10-06g">
</head>
<body>

<!-- Three soft coloured blobs behind everything -->
<div class="background-blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="page">

  <!-- Top bar: logo, sound and zoom controls, and the Home button -->
  <div class="top-bar">
    <a class="logo" id="logo-link" href="#" title="Go to the home page">
      <span class="logo-icon" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M12 2.6 4.5 5.8v6.1c0 4.6 3.1 8.4 7.5 9.5 4.4-1.1 7.5-4.9 7.5-9.5V5.8L12 2.6Z" fill="#fff"/><path d="m8.6 12.2 2.4 2.4 4.4-4.9" stroke="#4B3FE4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      ScamSquad Academy
    </a>
    <div class="spacer"></div>
    <div class="controls" role="group" aria-label="Sound and size">
      <button class="control" id="sound-button" type="button" aria-pressed="false" title="Sound on or off">&#128266;</button>
      <button class="control" id="quieter-button" type="button" aria-label="Quieter" title="Quieter">&minus;</button>
      <span class="volume-bars" id="volume-bars" role="img" aria-label="Volume"><i></i><i></i><i></i><i></i><i></i></span>
      <button class="control" id="louder-button" type="button" aria-label="Louder" title="Louder">+</button>
      <span class="divider" aria-hidden="true"></span>
      <button class="control" id="smaller-button" type="button" aria-label="Zoom out" title="Zoom out">&#128269;&minus;</button>
      <span class="zoom-level" id="zoom-level" aria-live="polite">100%</span>
      <button class="control" id="bigger-button" type="button" aria-label="Zoom in" title="Zoom in">&#128269;+</button>
    </div>
    <button class="home-button" id="home-button" type="button" aria-label="Home" title="Home" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v11h13V9"/><path d="M10 20v-6h4v6"/></svg>
    </button>
  </div>

  <!-- The five screens. game.js fills them in and shows one at a time. -->
  <div id="screen-home"></div>
  <div id="screen-age-check" hidden></div>
  <div id="screen-mission" hidden></div>
  <div id="screen-end" hidden></div>
  <div id="screen-grown-ups" hidden></div>

  <footer>
    <button class="footer-link" id="grown-ups-link" type="button">For grown-ups: parents and teachers</button>
    <button class="footer-link" id="footer-home-link" type="button" hidden>&larr; Back to home</button>
    <!-- "Played on ... devices": game.js fills this in once the counter is set up -->
    <span class="device-counter" id="device-counter" hidden></span>
    <span>No names, no tracking. Your score stays on this device only.</span>
  </footer>
</div>

<!-- missions.js has to load first, because game.js uses its words.
     The ?v= date tells browsers to fetch the new files after an update.
     Change the date here and on styles.css above every time you upload. -->
<script src="missions.js?v=2026-10-06g"></script>
<script src="game.js?v=2026-10-06g"></script>
</body>
</html>
