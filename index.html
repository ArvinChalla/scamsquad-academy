<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScamSquad Academy</title>
<!-- No webfont request on purpose. Loading fonts from Google would send every child's IP
     address and user agent to a third party on page load, which would contradict the
     promise that nothing is sent to any server. Fonts below are used if the device
     already has them and fall back to the system rounded face otherwise. -->

<style>
:root{
  --ground:#EEF2FF;
  --surface:#FFFFFF;
  --surface-2:#F4F6FE;
  --ink:#171A38;
  --ink-2:#4A507A;
  --ink-3:#7C82A8;
  --line:#DCE1F5;
  --line-2:#C3CAEA;

  --brand:#4B3FE4;
  --brand-ink:#3A2FBE;
  --brand-soft:#E4E1FF;

  --good:#0E8F68;
  --good-soft:#D7F5EA;
  --warn:#A66207;
  --warn-soft:#FDEFD4;
  --bad:#C0392B;
  --bad-soft:#FBE3E0;

  --t-explore:#E07C00;
  --t-explore-soft:#FFEDD2;
  --t-squad:#0E7F94;
  --t-squad-soft:#D6F0F5;
  --t-crew:#6B3FD4;
  --t-crew-soft:#E8E0FF;

  --shadow:0 2px 4px rgba(23,26,56,.06), 0 14px 32px -16px rgba(23,26,56,.28);
  --shadow-lg:0 4px 8px rgba(23,26,56,.08), 0 26px 60px -22px rgba(23,26,56,.4);

  --f-display:"Fredoka","Baloo 2","SF Pro Rounded",ui-rounded,"Segoe UI Variable Display","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","SF Pro Rounded",ui-rounded,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1024;
    --surface:#181B36;
    --surface-2:#20244A;
    --ink:#EAEDFB;
    --ink-2:#AEB5DC;
    --ink-3:#848CB8;
    --line:#2A2F58;
    --line-2:#3A4070;
    --brand:#8E86FF;
    --brand-ink:#B0AAFF;
    --brand-soft:#282465;
    --good:#4FD3A6;
    --good-soft:#123A2F;
    --warn:#F0B65C;
    --warn-soft:#3A2C12;
    --bad:#FF8A7A;
    --bad-soft:#3E1C18;
    --t-explore:#FFB553;
    --t-explore-soft:#3C2A10;
    --t-squad:#4FCBE0;
    --t-squad-soft:#0F3540;
    --t-crew:#AE8CFF;
    --t-crew-soft:#2C2160;
    --shadow:0 2px 4px rgba(0,0,0,.4), 0 14px 32px -16px rgba(0,0,0,.7);
    --shadow-lg:0 4px 8px rgba(0,0,0,.45), 0 26px 60px -22px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1024;
  --surface:#181B36;
  --surface-2:#20244A;
  --ink:#EAEDFB;
  --ink-2:#AEB5DC;
  --ink-3:#848CB8;
  --line:#2A2F58;
  --line-2:#3A4070;
  --brand:#8E86FF;
  --brand-ink:#B0AAFF;
  --brand-soft:#282465;
  --good:#4FD3A6;
  --good-soft:#123A2F;
  --warn:#F0B65C;
  --warn-soft:#3A2C12;
  --bad:#FF8A7A;
  --bad-soft:#3E1C18;
  --t-explore:#FFB553;
  --t-explore-soft:#3C2A10;
  --t-squad:#4FCBE0;
  --t-squad-soft:#0F3540;
  --t-crew:#AE8CFF;
  --t-crew-soft:#2C2160;
  --shadow:0 2px 4px rgba(0,0,0,.4), 0 14px 32px -16px rgba(0,0,0,.7);
  --shadow-lg:0 4px 8px rgba(0,0,0,.45), 0 26px 60px -22px rgba(0,0,0,.8);
}

*{box-sizing:border-box;}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-body);font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:8px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

.shell{max-width:860px;margin:0 auto;padding:22px 18px 60px;}

/* ============ top bar ============ */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
/* Sound and zoom controls. They sit in the top bar, which is on every screen,
   so they never float over the game. Only the screens below are zoomed. */
.prefs{display:flex;align-items:center;gap:4px;padding:4px;border:2px solid var(--line-2);border-radius:999px;background:var(--surface);}
.prefs .pf{min-width:38px;height:38px;padding:0 9px;border:0;border-radius:999px;background:transparent;color:var(--ink);
  font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1;cursor:pointer;white-space:nowrap;}
.prefs .pf:hover{background:var(--brand-soft);}
.prefs .pf:focus-visible{outline:3px solid var(--brand);outline-offset:1px;}
.prefs .pf:disabled{opacity:.35;cursor:default;background:transparent;}
.prefs #pf-mute[aria-pressed="true"]{background:var(--warn-soft);}
.pf-meter{display:flex;align-items:flex-end;gap:2px;height:20px;padding:0 2px;}
.pf-meter i{display:block;width:5px;border-radius:2px;background:var(--line-2);}
.pf-meter i:nth-child(1){height:6px}.pf-meter i:nth-child(2){height:9px}.pf-meter i:nth-child(3){height:12px}.pf-meter i:nth-child(4){height:16px}.pf-meter i:nth-child(5){height:20px}
.pf-meter i.on{background:var(--brand);}
.prefs.muted .pf-meter i.on{background:var(--ink-3);}
.pf-val{min-width:44px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--ink-2);}
.pf-sep{width:2px;height:24px;background:var(--line);margin:0 4px;border-radius:2px;}
.shell > [id^="screen-"],.shell > footer{zoom:var(--ui-zoom,1);}
@media (max-width:560px){
  .prefs{order:5;width:100%;justify-content:space-between;}
}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;}
.logo .mark{
  width:36px;height:36px;border-radius:11px;background:var(--brand);
  display:grid;place-items:center;flex-shrink:0;
}
.topbar .spacer{margin-left:auto;}
.ghost{
  background:transparent;border:2px solid var(--line-2);color:var(--ink-2);
  font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer;
}
.ghost:hover{border-color:var(--brand);color:var(--brand-ink);}

/* ============ home ============ */
.hero{
  background:var(--surface);border:2px solid var(--line);border-radius:22px;
  padding:32px 28px;box-shadow:var(--shadow);margin-bottom:22px;
  display:flex;gap:26px;align-items:center;flex-wrap:wrap;
}
.hero-copy{flex:1 1 320px;}
.hero h1{font-size:clamp(30px,5vw,44px);font-weight:700;margin-bottom:10px;}
.hero p{margin:0;color:var(--ink-2);font-size:18px;max-width:46ch;}
.hero-art{flex:0 0 auto;}

.pick-label{
  font-family:var(--f-display);font-size:20px;font-weight:600;margin:26px 0 14px;
}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
.track{
  background:var(--surface);border:3px solid var(--line);border-radius:20px;
  padding:22px 20px;text-align:left;cursor:pointer;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:12px;
  transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.track:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.track.explore:hover{border-color:var(--t-explore);}
.track.squad:hover{border-color:var(--t-squad);}
.track.crew:hover{border-color:var(--t-crew);}
.track .age{
  font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.04em;
  padding:4px 11px;border-radius:999px;align-self:flex-start;
}
.track.explore .age{background:var(--t-explore-soft);color:var(--t-explore);}
.track.squad .age{background:var(--t-squad-soft);color:var(--t-squad);}
.track.crew .age{background:var(--t-crew-soft);color:var(--t-crew);}
.track h3{font-size:24px;font-weight:700;}
.track p{margin:0;font-size:15px;color:var(--ink-2);}
.track .bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:auto;}
.track .bar i{display:block;height:100%;border-radius:99px;width:0;transition:width .5s ease;}
.track.explore .bar i{background:var(--t-explore);}
.track.squad .bar i{background:var(--t-squad);}
.track.crew .bar i{background:var(--t-crew);}
.track .prog{font-size:13px;font-weight:700;color:var(--ink-3);}
.track .go{
  margin-top:2px;font-family:var(--f-display);font-weight:600;font-size:16px;
  border:none;border-radius:12px;padding:11px;color:#fff;cursor:pointer;width:100%;
}
.track.explore .go{background:var(--t-explore);}
.track.squad .go{background:var(--t-squad);}
.track.crew .go{background:var(--t-crew);}

.homenote{
  margin-top:22px;background:var(--brand-soft);border-radius:16px;padding:18px 20px;
  font-size:15px;color:var(--ink-2);
}
.homenote strong{color:var(--ink);}

/* ============ game ============ */
.hud{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--surface);border:2px solid var(--line);border-radius:18px;
  padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow);
}
.hud .buddy{display:flex;align-items:center;gap:10px;}
.hud .bname{font-family:var(--f-display);font-weight:600;font-size:16px;}
.hud .brole{font-size:12px;color:var(--ink-3);font-weight:700;}
.hud .stat{margin-left:auto;display:flex;gap:16px;align-items:center;}
.hud .stat b{font-family:var(--f-display);font-size:20px;font-weight:700;}
.hud .stat span{font-size:12px;color:var(--ink-3);font-weight:700;display:block;line-height:1;}

.steps{display:flex;gap:6px;margin-bottom:16px;}
.steps i{flex:1;height:8px;border-radius:99px;background:var(--line);}
.steps i.done{background:var(--good);}
.steps i.now{background:var(--brand);}

/* ---- Explorers header: big stars on the left, a trail of mission stops ---- */
.hud.hud-kid{display:flex;align-items:center;gap:18px;padding:14px 18px;margin-bottom:16px;}
.hud.hud-kid .jar{position:relative;margin-left:0;display:flex;align-items:center;gap:8px;flex:0 0 auto;
  background:linear-gradient(180deg,#FFF6D6,#FFE7A3);border:3px solid #F2C14E;border-radius:20px;padding:8px 16px 8px 12px;
  box-shadow:0 4px 0 #E2A92B;}
.hud.hud-kid .jar-star{font-size:34px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08));}
.hud.hud-kid .jar b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;color:#7A4A00;min-width:2ch;}
.hud.hud-kid .jar .jar-label{font-family:var(--f-display);font-size:15px;font-weight:700;color:#9A6400;display:block;align-self:flex-end;padding-bottom:4px;}
.hud.hud-kid .jar.bump{animation:jarBump .55s cubic-bezier(.3,1.6,.5,1);}
.hud.hud-kid .jar-float{position:absolute;left:50%;top:-6px;font-family:var(--f-display);font-weight:700;font-size:22px;color:#C47F00;pointer-events:none;animation:jarFloat 1.1s ease-out forwards;}
@keyframes jarBump{0%{transform:scale(1)}35%{transform:scale(1.18) rotate(-3deg)}70%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes jarFloat{0%{opacity:0;transform:translate(-50%,6px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-38px)}}
.hud.hud-kid .trail{flex:1 1 auto;display:flex;align-items:center;min-width:0;}
.hud.hud-kid .trail i{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;
  font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--surface-2);color:var(--ink-3);border:3px solid var(--line);}
.hud.hud-kid .trail i.done{background:#FFF1C4;border-color:#F2C14E;font-size:17px;}
.hud.hud-kid .trail i.now{width:44px;height:44px;font-size:19px;background:var(--t-explore);border-color:var(--t-explore);color:#fff;box-shadow:0 0 0 5px var(--t-explore-soft);}
.hud.hud-kid .trail .link{flex:1 1 6px;height:5px;min-width:4px;background:var(--line);border-radius:9px;}
.hud.hud-kid .kid-buddy{flex:0 0 auto;line-height:0;}
.hud.hud-kid ~ .steps{display:none;}
@media (max-width:560px){
  .hud.hud-kid{flex-wrap:wrap;gap:12px;padding:12px;}
  .hud.hud-kid .trail{order:3;flex-basis:100%;}
  .hud.hud-kid .kid-buddy{margin-left:auto;}
  .hud.hud-kid .trail i{width:28px;height:28px;font-size:13px;}
  .hud.hud-kid .trail i.now{width:36px;height:36px;font-size:16px;}
}

.stage{
  background:var(--surface);border:2px solid var(--line);border-radius:22px;
  padding:26px;box-shadow:var(--shadow);
}
.scene-top{display:flex;gap:18px;align-items:flex-start;margin-bottom:6px;}
.scene-art{
  flex:0 0 auto;width:88px;height:88px;border-radius:20px;display:grid;place-items:center;font-size:44px;
}
.lvl-tag{
  font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:4px;
}
.stage h2{font-size:clamp(21px,3vw,27px);font-weight:700;margin-bottom:8px;}
.scene{font-size:17px;color:var(--ink-2);margin:0 0 20px;}
.scene .quote{
  display:block;background:var(--surface-2);border-left:4px solid var(--line-2);
  padding:11px 15px;border-radius:0 10px 10px 0;margin:12px 0;
  font-style:italic;color:var(--ink);
}
.ask{font-family:var(--f-display);font-size:19px;font-weight:600;margin-bottom:14px;}

.opts{display:grid;gap:12px;margin-bottom:8px;}
.opt{
  display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface-2);border:3px solid transparent;border-radius:16px;
  padding:16px 18px;cursor:pointer;color:var(--ink);
  transition:border-color .14s ease, transform .14s ease, background .14s ease;
}
.opt:hover:not(:disabled){border-color:var(--brand);transform:translateX(3px);}
.opt:disabled{cursor:default;opacity:.55;}
.opt .key{
  flex:0 0 auto;width:30px;height:30px;border-radius:10px;background:var(--surface);
  display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink-2);
  border:2px solid var(--line);
}
.opt .otxt b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;margin-bottom:2px;}
.opt .otxt span{font-size:15px;color:var(--ink-2);}
.opt.picked-good{border-color:var(--good);background:var(--good-soft);opacity:1;}
.opt.picked-soft{border-color:var(--warn);background:var(--warn-soft);opacity:1;}

.reply{border-radius:18px;padding:20px;margin-top:18px;display:none;}
.reply.show{display:block;animation:pop .3s ease;}
@keyframes pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.reply.win{background:var(--good-soft);border:2px solid var(--good);}
.reply.hint{background:var(--warn-soft);border:2px solid var(--warn);}
.reply h3{font-size:20px;font-weight:700;margin-bottom:8px;}
.reply.win h3{color:var(--good);}
.reply.hint h3{color:var(--warn);}
.reply p{margin:0 0 10px;font-size:16px;}
.reply p:last-child{margin-bottom:0;}
.reply .why{
  background:var(--surface);border-radius:12px;padding:13px 16px;margin-top:12px;font-size:15px;color:var(--ink-2);
}
.reply .why b{color:var(--ink);}

.nextrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.big{
  font-family:var(--f-display);font-weight:600;font-size:18px;border:none;border-radius:14px;
  padding:14px 26px;color:#fff;background:var(--brand);cursor:pointer;
}
.big:hover{background:var(--brand-ink);}
.big.alt{background:transparent;color:var(--ink-2);border:2px solid var(--line-2);}
.big.alt:hover{border-color:var(--brand);color:var(--brand-ink);background:transparent;}

.helpline{
  margin-top:16px;background:var(--surface);border:2px dashed var(--line-2);border-radius:16px;
  padding:14px 18px;font-size:14.5px;color:var(--ink-2);
}
.helpline b{color:var(--ink);font-family:var(--f-display);}
/* help card on the 14 to 18 levels: telling a parent comes first and biggest,
   the hotlines sit smaller underneath */
.helpcard{margin-top:18px;padding:18px;border-radius:20px;background:var(--surface);border:2px solid var(--t-crew);box-shadow:var(--shadow);}
.helpcard{padding:0;}.hc-sum{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;list-style:none;border-radius:18px;}.hc-sum::-webkit-details-marker{display:none;}.hc-sum:hover{background:var(--t-crew-soft);}.hc-sum:focus-visible{outline:3px solid var(--t-crew);outline-offset:2px;}.hc-sum-ico{font-size:24px;line-height:1;flex:0 0 auto;}.hc-sum-txt{flex:1 1 auto;font-size:16px;color:var(--ink-2);line-height:1.35;}.hc-sum-txt b{color:var(--ink);font-family:var(--f-display);margin-right:4px;}.hc-chev{flex:0 0 auto;font-size:16px;color:var(--ink-2);transition:transform .2s;}.helpcard[open] .hc-chev{transform:rotate(180deg);}.hc-body{padding:2px 18px 18px;}
.hc-main{display:flex;gap:14px;align-items:center;padding:18px 18px;border-radius:16px;background:#5B33C6;color:#fff;}
.hc-big{font-size:40px;line-height:1;flex:0 0 auto;}
.hc-main h3{margin:0 0 4px;font-family:var(--f-display);font-size:23px;line-height:1.25;color:#fff;}
.hc-main p{margin:0;font-size:17px;line-height:1.45;color:#fff;opacity:.95;}
.hc-main p b{color:#fff;}
.hc-more{margin:16px 2px 8px;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--ink-2);}
.hc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media (max-width:620px){.hc-grid{grid-template-columns:1fr;}.hc-main{align-items:flex-start;}}
.hc-item{display:flex;align-items:center;gap:10px;min-height:52px;padding:9px 12px;border-radius:12px;
  background:var(--t-crew-soft);color:var(--ink);text-decoration:none;border:2px solid transparent;transition:border-color .15s;}
.hc-item:hover,.hc-item:focus-visible{border-color:var(--t-crew);outline:none;}
.hc-ico{font-size:20px;line-height:1;flex:0 0 auto;}
.hc-txt{display:flex;flex-direction:column;gap:1px;min-width:0;}
.hc-txt b{font-family:var(--f-display);font-size:15px;font-weight:700;}
.hc-txt small{font-size:13px;color:var(--ink-2);line-height:1.3;overflow-wrap:anywhere;}
.hc-uk{margin:10px 2px 0;font-size:14px;color:var(--ink-2);}
.hc-uk a{color:var(--brand-ink);font-weight:700;}

/* ============ track scale ============ */
body[data-track="explore"] .stage{font-size:19px;}
body[data-track="explore"] .scene{font-size:20px;line-height:1.6;}
body[data-track="explore"] .ask{font-size:22px;}
body[data-track="explore"] .opt .otxt b{font-size:19px;}
body[data-track="explore"] .opt .otxt span{font-size:17px;}
body[data-track="explore"] .reply p{font-size:18px;}

/* ============ finish ============ */
.finish{
  background:var(--surface);border:2px solid var(--line);border-radius:22px;
  padding:34px 28px;text-align:center;box-shadow:var(--shadow);
}
.finish h2{font-size:clamp(26px,4vw,36px);font-weight:700;margin-bottom:8px;}
.finish .sc{font-family:var(--f-display);font-size:52px;font-weight:700;color:var(--brand);line-height:1;margin:14px 0 4px;}
.finish .scl{font-size:14px;color:var(--ink-3);font-weight:700;margin-bottom:20px;}
.badges{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0;}
.badge{
  background:var(--surface-2);border:2px solid var(--line);border-radius:16px;
  padding:14px 16px;width:158px;display:flex;flex-direction:column;
}
.badge span{margin-top:auto;}
.badge.earned{border-color:var(--good);background:var(--good-soft);}
.badge .bi{font-size:30px;line-height:1;}
.badge b{display:block;font-family:var(--f-display);font-size:15px;font-weight:600;margin:6px 0 2px;}
.badge span{font-size:12.5px;color:var(--ink-2);}
.recap{text-align:left;background:var(--surface-2);border-radius:16px;padding:18px 22px;margin-top:22px;}
.recap h4{font-size:17px;font-weight:600;margin-bottom:10px;}
.recap ul{margin:0;padding-left:20px;font-size:15.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px;}

/* ============ grown-ups ============ */
.panel{
  background:var(--surface);border:2px solid var(--line);border-radius:22px;
  padding:30px 28px;box-shadow:var(--shadow);
}
.panel h2{font-size:28px;font-weight:700;margin-bottom:6px;}
.panel .sub{color:var(--ink-2);margin:0 0 22px;}
.panel h3{font-size:19px;font-weight:600;margin:24px 0 8px;}
.panel p{font-size:15.5px;color:var(--ink-2);margin:0 0 10px;}
.panel ul{font-size:15.5px;color:var(--ink-2);padding-left:20px;margin:0 0 10px;display:flex;flex-direction:column;gap:5px;}
.panel a{color:var(--brand-ink);font-weight:700;}
.covers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:8px;}
.cover{background:var(--surface-2);border-radius:14px;padding:16px 18px;}
.cover b{display:block;font-family:var(--f-display);font-size:16px;font-weight:600;margin-bottom:6px;}
.cover ul{font-size:14px;padding-left:18px;gap:3px;}
.rules{border-left:4px solid var(--brand);padding-left:18px;}


/* ============ home v2 ============ */
.blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.blobs i{position:absolute;border-radius:50%;filter:blur(48px);opacity:.5;}
.blobs i:nth-child(1){width:340px;height:340px;background:var(--t-explore-soft);top:-90px;left:-70px;}
.blobs i:nth-child(2){width:300px;height:300px;background:var(--t-squad-soft);top:32%;right:-90px;}
.blobs i:nth-child(3){width:320px;height:320px;background:var(--t-crew-soft);bottom:-110px;left:22%;}
.shell{position:relative;z-index:1;}

.hero2{
  background:var(--surface);border:3px solid var(--line);border-radius:28px;
  padding:38px 30px 32px;box-shadow:var(--shadow-lg);text-align:center;
}
.crew-row{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-bottom:18px;}
.crew-row .m{animation:bob 3.4s ease-in-out infinite;}
.crew-row .m:nth-child(2){animation-delay:.5s;}
.crew-row .m:nth-child(3){animation-delay:1s;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.hero2 h1{
  font-size:clamp(30px,6.2vw,52px);font-weight:700;line-height:1.03;margin-bottom:12px;
}
.hero2 h1 em{font-style:normal;color:var(--brand);}
.hero2 .sub{font-size:clamp(16.5px,1.9vw,19.5px);color:var(--ink-2);margin:0 auto;max-width:44ch;}
.hero2 .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
.hero2 .chips span{
  font-family:var(--f-display);font-size:13px;font-weight:600;
  background:var(--surface-2);color:var(--ink-2);padding:6px 14px;border-radius:999px;
}

.askage{
  margin-top:24px;background:var(--surface);border:3px solid var(--line);border-radius:28px;
  padding:30px 26px;box-shadow:var(--shadow);text-align:center;
}
.askage h2{font-size:clamp(23px,3.6vw,32px);font-weight:700;margin-bottom:6px;}
.askage p{color:var(--ink-2);margin:0 0 22px;font-size:16.5px;}
.agepick{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.agepick button{
  font-family:var(--f-display);font-weight:700;cursor:pointer;
  width:150px;padding:20px 12px;border-radius:22px;border:3px solid var(--line);
  background:var(--surface-2);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.agepick button .big-n{font-size:29px;line-height:1;letter-spacing:-.02em;}
.agepick button .lil{font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;}
.agepick button:hover{transform:translateY(-5px) scale(1.03);box-shadow:var(--shadow-lg);}
.agepick button[data-age="explore"]:hover,.agepick button[data-age="explore"][aria-pressed="true"]{border-color:var(--t-explore);background:var(--t-explore-soft);}
.agepick button[data-age="squad"]:hover,.agepick button[data-age="squad"][aria-pressed="true"]{border-color:var(--t-squad);background:var(--t-squad-soft);}
.agepick button[data-age="crew"]:hover,.agepick button[data-age="crew"][aria-pressed="true"]{border-color:var(--t-crew);background:var(--t-crew-soft);}
.grownlink{
  margin-top:20px;background:none;border:none;cursor:pointer;
  font-family:var(--f-body);font-size:15.5px;font-weight:700;color:var(--ink-3);text-decoration:underline;
}
.grownlink:hover{color:var(--brand-ink);}

#reveal:empty{display:none;}
.revealcard{
  margin-top:22px;background:var(--surface);border:4px solid var(--line);border-radius:28px;
  padding:30px 28px;box-shadow:var(--shadow-lg);
  display:flex;gap:26px;align-items:center;flex-wrap:wrap;
  animation:rise .38s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97);}to{opacity:1;transform:none;}}
.revealcard.explore{border-color:var(--t-explore);}
.revealcard.squad{border-color:var(--t-squad);}
.revealcard.crew{border-color:var(--t-crew);}
.revealcard .art{flex:0 0 auto;}
.revealcard .body{flex:1 1 260px;min-width:0;}
.revealcard .age2{
  font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.05em;
  padding:5px 13px;border-radius:999px;display:inline-block;margin-bottom:8px;
}
.revealcard.explore .age2{background:var(--t-explore-soft);color:var(--t-explore);}
.revealcard.squad .age2{background:var(--t-squad-soft);color:var(--t-squad);}
.revealcard.crew .age2{background:var(--t-crew-soft);color:var(--t-crew);}
.revealcard h3{font-size:clamp(26px,4vw,36px);font-weight:700;margin-bottom:6px;}
.revealcard p{margin:0 0 14px;color:var(--ink-2);font-size:17px;}
.revealcard .bar2{height:11px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:7px;}
.revealcard .bar2 i{display:block;height:100%;border-radius:99px;transition:width .6s ease;}
.revealcard.explore .bar2 i{background:var(--t-explore);}
.revealcard.squad .bar2 i{background:var(--t-squad);}
.revealcard.crew .bar2 i{background:var(--t-crew);}
.revealcard .prog2{font-size:14px;font-weight:700;color:var(--ink-3);display:block;margin-bottom:16px;}
.revealcard .play{
  font-family:var(--f-display);font-size:21px;font-weight:700;border:none;border-radius:18px;
  padding:16px 34px;color:#fff;cursor:pointer;width:100%;
  transition:transform .14s ease, filter .14s ease;
}
.revealcard .play:hover{transform:translateY(-2px);filter:brightness(1.07);}
.revealcard.explore .play{background:var(--t-explore);}
.revealcard.squad .play{background:var(--t-squad);}
.revealcard.crew .play{background:var(--t-crew);}
.switchlink{
  display:block;margin:14px auto 0;background:none;border:none;cursor:pointer;
  font-family:var(--f-body);font-size:14.5px;font-weight:700;color:var(--ink-3);text-decoration:underline;
}
.switchlink:hover{color:var(--brand-ink);}

.trophies{
  margin-top:22px;background:var(--surface);border:3px solid var(--line);border-radius:24px;
  padding:20px 24px;box-shadow:var(--shadow);
  display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;
}
.trophies .t{text-align:center;min-width:96px;}
.trophies .t b{display:block;font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--brand);line-height:1;}
.trophies .t span{display:block;font-size:12.5px;font-weight:700;color:var(--ink-3);margin-top:5px;letter-spacing:.04em;text-transform:uppercase;}
.trophies .t .em{font-size:26px;}

/* ============ export bar ============ */
.exportbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center;}
.savehint{
  margin-top:12px;background:var(--surface-2);border-radius:12px;padding:12px 16px;
  font-size:14.5px;color:var(--ink-2);
}
.savehint b{color:var(--ink);}
#certimg{max-width:100%;border-radius:14px;box-shadow:var(--shadow-lg);margin-top:14px;display:block;}

/* ============ age chooser ============ */
.agebar{
  background:var(--surface);border:2px solid var(--line);border-radius:18px;
  padding:18px 20px;margin:26px 0 16px;box-shadow:var(--shadow);
  display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;
}
.agebar .q{font-family:var(--f-display);font-size:19px;font-weight:600;}
.agebar .opts2{display:flex;gap:9px;flex-wrap:wrap;}
.agebar button{
  font-family:var(--f-display);font-size:16px;font-weight:600;
  padding:10px 18px;border-radius:999px;border:2px solid var(--line-2);
  background:var(--surface);color:var(--ink);cursor:pointer;
}
.agebar button:hover{border-color:var(--brand);color:var(--brand-ink);}
.agebar button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;}
.track.rec{border-color:var(--brand);}
.track .recflag{
  display:none;font-family:var(--f-display);font-size:12.5px;font-weight:600;
  letter-spacing:.05em;color:var(--brand-ink);background:var(--brand-soft);
  padding:4px 10px;border-radius:999px;align-self:flex-start;
}
.track.rec .recflag{display:inline-block;}
.track.faded{opacity:.55;}

/* ============ conversation card ============ */
.convo{
  margin-top:22px;background:#F6F3FF;color:#221E38;border:2px solid #C9BEF5;border-radius:18px;
  padding:24px;text-align:left;print-color-adjust:exact;-webkit-print-color-adjust:exact;
}
.convo .kicker{
  font-family:var(--f-display);font-size:11.5px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:#6B5AC7;
}
.convo h4{font-family:var(--f-display);font-size:21px;font-weight:700;margin:6px 0 8px;color:#221E38;}
.convo p.lead{font-size:15.5px;color:#4A4560;margin:0 0 16px;}
.convo ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px;}
.convo ol li{font-size:16.5px;font-weight:700;color:#221E38;}
.convo ol li span{display:block;font-weight:400;font-size:14.5px;color:#4A4560;margin-top:3px;}
.convo .tail{margin:16px 0 0;font-size:14px;color:#4A4560;border-top:2px solid #DCD3FA;padding-top:12px;}

/* ============ teacher toolkit ============ */
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.tabs button{
  font-family:var(--f-display);font-size:15px;font-weight:600;
  padding:9px 18px;border-radius:999px;border:2px solid var(--line-2);
  background:transparent;color:var(--ink-2);cursor:pointer;
}
.tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff;}
.lesson{
  background:var(--surface-2);border-radius:16px;padding:22px;margin-bottom:16px;
}
.lesson h4{font-family:var(--f-display);font-size:20px;font-weight:700;margin-bottom:2px;}
.lesson .meta{
  display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px;
}
.lesson .meta span{
  font-family:var(--f-mono,var(--f-body));font-size:12.5px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  padding:4px 10px;border-radius:999px;
}
.lesson h5{
  font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin:16px 0 6px;
}
.lesson ul,.lesson ol{margin:0;padding-left:20px;font-size:15.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:5px;}
.lesson p{font-size:15.5px;color:var(--ink-2);margin:0;}
.warnbox{
  background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:0 10px 10px 0;
  padding:14px 16px;margin-top:14px;font-size:15px;color:var(--ink);
}

/* ============ age gate ============ */
.gate{
  background:var(--surface);border:2px solid var(--line);border-radius:22px;
  padding:32px 28px;box-shadow:var(--shadow);text-align:center;max-width:620px;margin:0 auto;
}
.gate .who{margin-bottom:8px;}
.gate .band{
  display:inline-block;font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.05em;
  background:var(--t-crew-soft);color:var(--t-crew);padding:5px 14px;border-radius:999px;margin-bottom:14px;
}
.gate h2{font-size:clamp(23px,3.4vw,30px);font-weight:700;margin-bottom:12px;}
.gate p{font-size:16.5px;color:var(--ink-2);margin:0 auto 12px;max-width:48ch;}
.gate p.strongline{color:var(--ink);font-weight:700;}
.gate .quiz{
  background:var(--surface-2);border-radius:16px;padding:20px;margin-top:22px;
}
.gate .quiz .q{font-family:var(--f-display);font-size:21px;font-weight:600;margin-bottom:14px;}
.gate .typed{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;}
.gate .typed input{
  font-family:var(--f-display);font-size:26px;font-weight:700;text-align:center;
  width:130px;padding:12px 14px;border-radius:14px;border:2px solid var(--line-2);
  background:var(--surface);color:var(--ink);
}
.gate .typed input:focus{border-color:var(--brand);}
.gate .typed button{
  font-family:var(--f-display);font-size:17px;font-weight:600;
  padding:14px 24px;border-radius:14px;border:none;
  background:var(--brand);color:#fff;cursor:pointer;
}
.gate .typed button:hover{background:var(--brand-ink);}
.gate .tries{margin-top:10px;font-size:13.5px;color:var(--ink-3);font-weight:700;}
.exitrow{margin-top:14px;text-align:center;}
.exitrow button{
  background:none;border:none;cursor:pointer;font-family:var(--f-body);
  font-size:14.5px;font-weight:700;color:var(--ink-3);text-decoration:underline;
}
.exitrow button:hover{color:var(--brand-ink);}
.gate .msg{margin-top:14px;font-size:15.5px;color:var(--warn);font-weight:700;min-height:22px;}
.gate .escape{margin-top:22px;}

/* ============ certificate ============ */
.certbox{margin-top:24px;background:var(--surface-2);border-radius:18px;padding:22px;text-align:left;}
.certbox h4{font-family:var(--f-display);font-size:19px;font-weight:600;margin-bottom:6px;}
.certbox p.cn{margin:0 0 14px;font-size:14.5px;color:var(--ink-2);}
.namerow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.namerow input{
  flex:1 1 200px;font-family:var(--f-body);font-size:17px;font-weight:600;
  padding:12px 15px;border-radius:12px;border:2px solid var(--line-2);
  background:var(--surface);color:var(--ink);min-width:0;
}
.namerow input::placeholder{color:var(--ink-3);font-weight:400;}
.namerow input:focus{border-color:var(--brand);}
.privline{
  display:flex;gap:8px;align-items:flex-start;margin-top:12px;
  font-size:13.5px;color:var(--ink-2);
}
.privline svg{flex:0 0 auto;margin-top:2px;}

#cert{
  margin-top:20px;background:#FFFDF7;color:#221E38;border:3px solid #C9A227;border-radius:14px;
  padding:30px 28px;text-align:center;position:relative;
  box-shadow:0 10px 30px -18px rgba(0,0,0,.45);
  print-color-adjust:exact;-webkit-print-color-adjust:exact;
}
#cert .inner{border:2px dashed #E0CE8E;border-radius:9px;padding:24px 18px;}
#cert .kicker{
  font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.24em;
  text-transform:uppercase;color:#9A7B12;
}
#cert h3{font-family:var(--f-display);font-size:clamp(22px,4vw,30px);font-weight:700;color:#221E38;margin:8px 0 14px;}
#cert .who{
  font-family:var(--f-display);font-size:clamp(28px,6vw,44px);font-weight:700;color:#3A2FBE;
  line-height:1.1;margin:6px 0;word-break:break-word;
}
#cert .rule{height:2px;background:#E0CE8E;max-width:300px;margin:12px auto 16px;}
#cert .said{font-size:16px;color:#4A4560;margin:0 auto 4px;max-width:44ch;}
#cert .list{font-size:15px;color:#4A4560;margin:14px auto 0;max-width:46ch;}
#cert .list b{color:#221E38;}
#cert .foot{
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  margin-top:22px;padding-top:14px;border-top:2px solid #EFE4C0;
  font-size:13px;color:#6A6480;text-align:left;
}
#cert .foot b{display:block;color:#221E38;font-family:var(--f-display);font-size:15px;}
#cert .seal{position:absolute;top:-14px;right:-10px;}

@media print{
  body{background:#fff;}
  body *{visibility:hidden !important;}
  .printnow, .printnow *{visibility:visible !important;}
  .printnow{position:absolute;left:0;top:0;width:100%;margin:0;box-shadow:none;border-radius:0;}
  .noprint{display:none !important;}
  @page{margin:14mm;}
}

footer{margin-top:30px;text-align:center;font-size:13px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:8px;}
.footlink{all:unset;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--brand-ink);text-decoration:underline;text-underline-offset:3px;padding:6px 4px;}
.footlink:hover{color:var(--brand);}
.footlink:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px;}

@media (max-width:560px){
  .shell{padding:16px 13px 50px;}
  .stage{padding:20px 17px;}
  .scene-art{width:64px;height:64px;font-size:32px;border-radius:16px;}
  .hero{padding:24px 20px;}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
</style>

/* The older tracks learn by looking at a thing that resembles what they
   actually see on a phone, not by reading a paragraph about it. */
.device{border:3px solid var(--line-2);border-radius:20px;overflow:hidden;background:#1e2030;box-shadow:var(--shadow-lg);margin:4px 0 2px;}
.device-bar{display:flex;align-items:center;gap:8px;padding:9px 13px;background:#2b2d3e;color:#cfd3e8;font-size:13px;font-weight:700;font-family:var(--f-body);}
.device-bar .dot{width:10px;height:10px;border-radius:50%;background:#3fb950;flex:0 0 auto;}
.device-bar .who{display:flex;flex-direction:column;line-height:1.25;}
.device-bar .who small{opacity:.6;font-weight:600;font-size:11px;}
.urlbar{display:flex;align-items:center;gap:7px;padding:8px 12px;background:#15161f;color:#aeb4d0;font-family:var(--f-mono,monospace);font-size:12.5px;word-break:break-all;}
.urlbar .lock{opacity:.7;flex:0 0 auto;}
.chatwrap{padding:14px 13px 16px;display:flex;flex-direction:column;gap:9px;background:#1e2030;}
.msg{max-width:88%;padding:10px 13px;border-radius:15px;font-size:14.5px;line-height:1.45;font-family:var(--f-body);background:#33364d;color:#e7eaf8;border-bottom-left-radius:5px;}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-left-radius:15px;border-bottom-right-radius:5px;}
.msg .stamp{display:block;margin-top:5px;font-size:10.5px;opacity:.55;}
.sitebox{padding:20px 16px;background:#f4f5fb;color:#14162a;text-align:center;font-family:var(--f-body);}
.sitebox h4{font-family:var(--f-display);font-size:21px;margin:0 0 8px;color:#14162a;}
.sitebox .field{display:block;width:100%;margin:7px 0;padding:10px 12px;border:2px solid #c8cce0;border-radius:9px;background:#fff;color:#6a7090;font-size:13.5px;text-align:left;}
.sitebox .cta{display:inline-block;margin-top:9px;padding:11px 24px;border-radius:10px;background:#e8453c;color:#fff;font-family:var(--f-display);font-weight:700;font-size:16px;}
/* a tell is a tappable giveaway sitting on top of the mockup */
.tell{all:unset;cursor:pointer;border-radius:5px;padding:0 3px;margin:0 -3px;box-shadow:inset 0 -3px 0 rgba(255,210,80,.42);transition:background .15s,box-shadow .15s;}
.tell:hover,.tell:focus-visible{background:rgba(255,210,80,.26);outline:2px solid var(--warn);outline-offset:1px;}
.tell.got{background:var(--good-soft);color:var(--good);box-shadow:none;font-weight:800;}
.tell.got::after{content:" \2714";font-size:.85em;}
.tell.miss{animation:wobble .4s ease;}
/* a block tell wraps a whole chat bubble, so the highlight goes on the bubble */
.tell-block{display:block;box-shadow:none;padding:0;margin:0;border-radius:15px;}
.tell-block .msg{transition:box-shadow .15s,transform .15s;}
.tell-block:hover .msg,.tell-block:focus-visible .msg{box-shadow:0 0 0 3px var(--warn);transform:translateX(2px);}
.tell-block:focus-visible{outline:none;}
.tell-block.got{background:none;}
.tell-block.got::after{content:none;}
.tell-block.got .msg{box-shadow:0 0 0 3px var(--good);background:#1d4a3a;}
.tell-block.got .msg::after{content:" \2714";font-weight:800;color:#7fe3bd;}
.tellbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;padding:11px 14px;border-radius:13px;background:var(--surface-2);font-family:var(--f-display);font-weight:700;color:var(--ink-2);}
.tellbar .pips{display:flex;gap:6px;}
.tellbar .pips i{width:13px;height:13px;border-radius:50%;background:var(--line-2);display:block;}
.tellbar .pips i.on{background:var(--good);}
/* bubbles size to their text, mine on the right */
.chatwrap .msg{align-self:flex-start;}
.chatwrap .msg.me{align-self:flex-end;}
.tell-block{display:flex;flex-direction:column;}
.msg .who{display:block;font-size:11.5px;font-weight:800;opacity:.72;margin-bottom:2px;}
.msg a,.msg .link{color:#8fb8ff;text-decoration:underline;word-break:break-all;}
.sysmsg{align-self:center;font-size:12px;font-weight:700;color:#9aa0c0;background:#262838;border-radius:99px;padding:4px 12px;text-align:center;}
.linkcard{display:block;margin-top:8px;background:#26283a;border-left:3px solid #5865f2;border-radius:7px;padding:9px 11px;font-size:13px;}
.linkcard b{display:block;color:#e7eaf8;font-size:14px;}
.qr{display:block;position:relative;width:104px;height:104px;margin:8px 0 2px;border:6px solid #fff;border-radius:6px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/13px 13px;box-shadow:0 0 0 1px #c8cce0;}.qr::before,.qr::after{content:"";position:absolute;top:0;left:0;width:22px;height:22px;background:#fff;border:5px solid #111;box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 11px #111;}.qr::after{left:auto;right:0;}
.hiddenimg{display:grid;place-items:center;width:190px;height:120px;margin-top:6px;border-radius:9px;
  background:repeating-linear-gradient(45deg,#3a3d55 0 10px,#44476a 10px 20px);color:#e7eaf8;font-size:12px;font-weight:800;text-align:center;padding:10px;}
.gain{display:inline-block;margin-top:6px;padding:6px 10px;border-radius:8px;background:#123d2c;color:#5ff0a8;font-weight:800;font-size:15px;}
/* app frame: a settings screen or a notification list */
.app-bar{background:#f0f2fa;color:#14162a;border-bottom:1px solid #d9ddee;}
.appbody{background:#fff;color:#14162a;padding:6px 0;font-family:var(--f-body);}
.arow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;border-bottom:1px solid #eceef6;font-size:14.5px;}
.arow:last-child{border-bottom:none;}
.arow small{display:block;color:#6a7090;font-size:12px;}
.toggle{flex:0 0 auto;width:44px;height:26px;border-radius:99px;background:#c9cde0;position:relative;}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;}
.toggle.on{background:#34c759;}
.toggle.on::after{left:21px;}
.notif{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid #eceef6;font-size:14px;line-height:1.4;}
.notif .ico{flex:0 0 auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:#eef0fa;font-size:17px;}
.notif small{display:block;color:#6a7090;font-size:11.5px;}
/* block tells on light rows */
.tell-block > .arow,.tell-block > .notif{transition:box-shadow .15s;}
.tell-block:hover > .arow,.tell-block:hover > .notif,.tell-block:focus-visible > .arow,.tell-block:focus-visible > .notif{box-shadow:inset 0 0 0 3px var(--warn);}
.tell-block.got > .arow,.tell-block.got > .notif{box-shadow:inset 0 0 0 3px var(--good);background:var(--good-soft);}
.tell-block > .arow,.tell-block > .notif{position:relative;padding-right:38px;}
.tell-block.got > .arow::after,.tell-block.got > .notif::after{content:"\2714";color:var(--good);font-weight:800;position:absolute;right:14px;top:50%;transform:translateY(-50%);}
.sitebox .tell,.appbody .tell{box-shadow:inset 0 -3px 0 rgba(230,160,0,.5);}
.sitebox .tell.got,.appbody .tell.got{background:#d7f5ea;color:#0e6b4e;}
.sitebox .fineprint{display:block;margin-top:10px;font-size:11.5px;color:#7a7f99;}
.sitebox .badge{display:inline-block;margin:4px 3px;padding:4px 9px;border-radius:99px;background:#e8eaf6;font-size:12px;font-weight:700;color:#3d4266;}
.sitebox .feed{margin:10px auto 0;max-width:280px;text-align:left;font-size:13px;}
.sitebox .feed div{padding:5px 8px;border-radius:6px;background:#eef9f2;margin-top:4px;color:#126b45;font-weight:700;}
.tell-block > :not(.msg){transition:box-shadow .15s;}
.tell-block:hover > :not(.msg),.tell-block:focus-visible > :not(.msg){box-shadow:0 0 0 3px var(--warn);}
.tell-block.got > :not(.msg){box-shadow:0 0 0 3px var(--good);}
.tell-block.got > .sysmsg{background:#1d4a3a;color:#7fe3bd;}
.tell-block.got > .sysmsg::after{content:" \2714";}
.chatwrap .tell-block > .sysmsg{align-self:center;}
.urlbar .tell{box-shadow:inset 0 -3px 0 rgba(255,210,80,.55);color:#e7eaf8;}
.urlbar .tell.got{background:#1d4a3a;color:#7fe3bd;}
/* 6 to 9: same fake screens, bigger text and bigger tap targets */
.hud-kid ~ .stage .chatwrap{gap:12px;padding:16px 14px 18px;}
.hud-kid ~ .stage .msg{font-size:18px;padding:12px 16px;line-height:1.4;}
.hud-kid ~ .stage .sysmsg{font-size:15px;padding:7px 14px;}
.hud-kid ~ .stage .arow{font-size:18px;padding:15px 16px;}
.hud-kid ~ .stage .tell-block > .arow,.hud-kid ~ .stage .tell-block > .notif{padding-right:46px;}
.hud-kid ~ .stage .arow b{font-size:18px;}
.hud-kid ~ .stage .device-bar{font-size:15px;}
.hud-kid ~ .stage .tellbar #tellmsg{font-size:17px;}
.hud-kid ~ .stage .decide-ask{font-size:21px;}
.hud-kid ~ .stage .opt .otxt b{font-size:18px;}

/* a numbered how-it-works list inside an explanation */
.steps3{margin:10px 0 10px;padding-left:22px;}
.steps3 li{margin:6px 0;line-height:1.45;}


/* ---- Level 1 and Level 2 on the age card ---- */
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
@media (max-width:560px){.worlds{grid-template-columns:1fr;}}
.world{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:16px;
  border:3px solid var(--line-2);background:var(--surface);transition:transform .15s,border-color .15s,box-shadow .15s;}
.world:hover,.world:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow);}
.world:focus-visible{outline:3px solid var(--brand);outline-offset:2px;}
.revealcard.explore .world{border-color:var(--t-explore-soft);} .revealcard.explore .world:hover{border-color:var(--t-explore);}
.revealcard.squad .world{border-color:var(--t-squad-soft);} .revealcard.squad .world:hover{border-color:var(--t-squad);}
.revealcard.crew .world{border-color:var(--t-crew-soft);} .revealcard.crew .world:hover{border-color:var(--t-crew);}
.wtop{display:flex;align-items:center;gap:8px;}
.wnum{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink);}
.newtag{font-family:var(--f-display);font-weight:700;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--brand);color:#fff;letter-spacing:.03em;}
.wdesc{font-size:15px;line-height:1.4;color:var(--ink-2);}
.world .bar2{margin:4px 0 0;}
.wfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.world .prog2{margin:0;font-size:13px;}
.wcta{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--brand-ink);white-space:nowrap;}
/* when Level 1 is done, Level 2 is the one that stands out */
.worlds.w1done .world:last-child{box-shadow:0 0 0 4px var(--brand-soft);border-color:var(--brand);}
.worlds.w1done .world:last-child .wcta{color:#fff;background:var(--brand);padding:6px 12px;border-radius:99px;}

.world.locked{cursor:not-allowed;background:var(--surface-2);border-style:dashed;}.world.locked:hover{transform:none;box-shadow:none;}.world.locked .wnum,.world.locked .wdesc{color:var(--ink-3);}.world.locked .wcta{font-size:20px;}.world.nope{animation:wobble .4s ease;}.lockmsg{min-height:22px;margin-top:10px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink-2);}.unlockdone{margin-left:8px;font-weight:700;color:var(--good);}
/* ---- the push to Level 2 on the end screen ---- */
.nextworld{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:22px 0;padding:18px 20px;border-radius:18px;
  background:var(--brand-soft);border:3px solid var(--brand);text-align:left;}
.nw-ico{font-size:40px;line-height:1;flex:0 0 auto;}
.nw-txt{flex:1 1 220px;display:flex;flex-direction:column;gap:4px;}
.nw-txt b{font-family:var(--f-display);font-size:21px;color:var(--ink);}
.nw-txt span{font-size:16px;color:var(--ink-2);line-height:1.4;}
.nextworld .big{flex:0 0 auto;}
.nextworld.done2{background:var(--good-soft);border-color:var(--good);}

/* ---- email mockups ---- */
.mailbody{background:#fff;color:#14162a;padding:14px 16px 18px;font-family:var(--f-body);font-size:14.5px;line-height:1.5;}
.mhead{padding:6px 0;border-bottom:1px solid #eceef6;overflow-wrap:anywhere;}
.mlabel{display:inline-block;min-width:62px;color:#6a7090;font-size:12.5px;font-weight:700;}
.mtext{padding-top:12px;}
.mailbody .cta{display:inline-block;padding:10px 22px;border-radius:10px;background:#2f6fde;color:#fff;font-family:var(--f-display);font-weight:700;}
.mailbody .fineprint{display:block;margin-top:6px;font-size:12px;color:#7a7f99;}
.mailbody .tell{box-shadow:inset 0 -3px 0 rgba(230,160,0,.5);}
.mailbody .tell.got{background:#d7f5ea;color:#0e6b4e;}
.chatwrap .tell, .mailbody .tell{cursor:pointer;}
/* browser permission buttons */
.pbtn{display:inline-block;margin:0 4px;padding:7px 18px;border-radius:8px;border:2px solid #c8cce0;background:#fff;color:#14162a;font-weight:700;}
.pbtn-on{background:#2f6fde;border-color:#2f6fde;color:#fff;}
.hud-kid ~ .stage .sitebox{font-size:17px;}
.hud-kid ~ .stage .sitebox .field{font-size:16px;padding:12px;}
.cover .wl{margin:10px 0 2px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}

/* ---- game-style looks. Colours and shapes only, never real logos. ---- */
.gamechip{margin-left:auto;flex:0 0 auto;padding:3px 9px;border-radius:6px;font-family:var(--f-display);font-weight:700;font-size:12px;
  background:rgba(255,255,255,.16);color:#fff;letter-spacing:.02em;}
.urlbar{display:flex;align-items:center;}
.urlbar .addr{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;}
/* Minecraft-style: grass and dirt, blocky */
.theme-mc .urlbar,.theme-mc .device-bar{background:#5d8c32;color:#fff;border-bottom:6px solid #7a5230;}
.theme-mc .sitebox{background:repeating-linear-gradient(0deg,#f3efe4 0 18px,#ede7d8 18px 36px);}
.theme-mc .sitebox h4{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:.04em;color:#3b2a14;text-shadow:2px 2px 0 #d9cdb2;}
.theme-mc .sitebox .cta{border-radius:0;background:#5d8c32;box-shadow:inset -3px -3px 0 #3f6421,inset 3px 3px 0 #86b85a;}
.theme-mc .sitebox .field{border-radius:0;border-color:#8b8b8b;}
/* Fortnite-style: purple-blue with a yellow pop */
.theme-fn .device-bar,.theme-fn .urlbar{background:linear-gradient(90deg,#1e1a63,#4b2bd8);color:#fff;}
.theme-fn .chatwrap{background:#17153a;}
.theme-fn .msg{background:#2c2870;}
.theme-fn .gamechip{background:#f7d23e;color:#1e1a63;}
/* Roblox-style: plain black and white */
.theme-rbx .urlbar,.theme-rbx .device-bar{background:#1b1b1f;color:#fff;}
.theme-rbx .gamechip{background:#fff;color:#1b1b1f;}
.theme-rbx .sitebox .cta{background:#1b1b1f;}
/* Discord-style */
.theme-dc .device-bar{background:#4752c4;color:#fff;}
.theme-dc .chatwrap{background:#313338;}
.theme-dc .msg{background:#3f4248;}
/* WhatsApp-style */
.theme-wa .device-bar{background:#0b5a4e;color:#fff;}
.theme-wa .chatwrap{background:#0b141a;}
.theme-wa .msg{background:#1f2c33;}
.theme-wa .msg.me{background:#005c4b;}
/* TikTok-style */
.theme-tt .urlbar{background:#111;color:#fff;box-shadow:inset 0 -3px 0 #25f4ee,inset 0 -6px 0 #fe2c55;}
.theme-tt .sitebox .cta{background:#fe2c55;}
/* Twitch-style */
.theme-tw .device-bar{background:#6441a5;color:#fff;}
.theme-tw .chatwrap{background:#18181b;}
.theme-tw .msg{background:#26262c;}
/* Instagram-style */
.theme-ig .device-bar{background:linear-gradient(90deg,#833ab4,#e1306c,#f77737);color:#fff;}
/* Spot the Fake cards */
.tcard.tc-mc .thead{background:#5d8c32;color:#fff;}
.tcard.tc-fn .thead{background:linear-gradient(90deg,#1e1a63,#4b2bd8);color:#fff;}
.grown p.fine,p.fine{font-size:13.5px;color:var(--ink-3);line-height:1.5;}

/* explanations: takeaway first, detail on tap */
.why .take{margin:0 0 6px;}
.why details.more{margin-top:4px;}
.why details.more summary{cursor:pointer;display:inline-block;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--brand-ink);
  padding:4px 12px;border-radius:99px;background:var(--brand-soft);list-style:none;}
.why details.more summary::-webkit-details-marker{display:none;}
.why details.more summary::after{content:" \25BE";}
.why details.more[open] summary::after{content:" \25B4";}
.why .more-body{margin-top:8px;}
/* clue button and the glow it puts on the next thing to find */
.cluebtn{flex:0 0 auto;min-height:44px;border:2px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:99px;padding:7px 14px;
  font-family:var(--f-display);font-weight:700;font-size:14px;cursor:pointer;}
.cluebtn:hover{background:#fbe2b0;}
.cluebtn[hidden]{display:none;}
.hintme{animation:hintGlow 1s ease-in-out 4;outline:4px solid #ffcf4a;outline-offset:3px;border-radius:12px;}
@keyframes hintGlow{0%,100%{outline-color:#ffcf4a}50%{outline-color:rgba(255,207,74,.15)}}
/* order: recovery steps */
.orderbox{display:grid;gap:12px;margin-top:6px;}
.osit{padding:14px 16px;border-radius:14px;background:var(--bad-soft);border:2px solid var(--bad);font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink);}
.olabel{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;}
.oslots{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;}
.oslot{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:12px;border:2px dashed var(--line-2);background:var(--surface-2);}
.oslot.ofill{border-style:solid;border-color:var(--good);background:var(--good-soft);font-weight:700;}
.onum{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-2);
  font-family:var(--f-display);font-weight:700;font-size:14px;}
.oslot.ofill .onum{background:var(--good);border-color:var(--good);color:#fff;}
.osteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;}
.ostep{min-height:52px;padding:10px 14px;border-radius:14px;border:3px solid var(--line-2);background:var(--surface);color:var(--ink);text-align:left;
  font-family:var(--f-body);font-weight:700;font-size:16px;line-height:1.35;cursor:pointer;}
.ostep:hover:not(:disabled){border-color:var(--brand);}
.ostep.oused{opacity:.35;text-decoration:line-through;cursor:default;}
.ostep.onope{opacity:.5;border-color:var(--bad);cursor:default;}
.ostep.owait{animation:wobble .4s ease;}
.hud-kid ~ .stage .ostep{font-size:18px;min-height:58px;}
/* decide: what you do once you have seen it */
.decide{margin-top:16px;padding-top:16px;border-top:2px dashed var(--line-2);animation:fadeUp .35s ease both;}
.decide-ask{font-family:var(--f-display);font-weight:700;font-size:19px;margin-bottom:10px;color:var(--ink);}
.tellbar #tellmsg{flex:1 1 240px;font-family:var(--f-body);font-weight:600;font-size:15px;line-height:1.45;color:var(--ink);}

/* triage: several real-looking messages, only some are scams */
.triage{display:grid;gap:11px;margin-top:12px;}
.tcard{all:unset;cursor:pointer;display:block;border:3px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);transition:border-color .15s,transform .15s;}
.tcard:hover,.tcard:focus-visible{border-color:var(--brand);transform:translateY(-2px);}
.tcard .thead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:13.5px;color:var(--ink-2);}
.tcard .tbody{padding:11px 13px;font-size:14.5px;line-height:1.45;color:var(--ink);font-family:var(--f-body);}
.tcard.scam{border-color:var(--bad);background:var(--bad-soft);}
.tcard.safe{border-color:var(--good);background:var(--good-soft);}
.tcard .verdict{display:none;padding:9px 13px;font-family:var(--f-display);font-weight:700;font-size:13.5px;}
.tcard.scam .verdict,.tcard.safe .verdict{display:block;}
.tcard.scam .verdict{color:var(--bad);}
.tcard.safe .verdict{color:var(--good);}

/* ============ animated 6-9 missions ============ */
.anim-scene{position:relative;min-height:330px;border:3px solid var(--line);border-radius:22px;overflow:hidden;background:linear-gradient(180deg,var(--brand-soft),var(--surface-2));margin-top:10px}
.anim-gamebar{position:absolute;left:0;right:0;top:0;height:54px;background:var(--surface);border-bottom:2px solid var(--line);display:flex;align-items:center;padding:0 16px;font-family:var(--f-display);font-weight:700}
.fake-coins{margin-left:auto;background:var(--warn-soft);border-radius:999px;padding:5px 11px}

.float-stage{position:relative;min-height:350px;border:3px solid var(--line);border-radius:22px;overflow:hidden;background:var(--surface-2);margin-top:10px}
.chat-avatar{position:absolute;left:18px;top:18px;width:86px;height:86px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-size:42px;animation:avatarBob 2s ease-in-out infinite}

/* Mission 1 layout. Three zones in normal flow, so nothing can sit on top
   of anything else: the game bar, a stage the pop-up barges into, and a dock
   where Pip talks and the bin waits. The calm game frame is what makes the
   loud pop-up read as the intruder. */
.anim-scene{display:flex;flex-direction:column;min-height:0;}
.anim-gamebar{position:static;height:auto;min-height:54px;flex:0 0 auto;}
.anim-stage{position:relative;height:250px;flex:0 0 auto;}
.anim-stage .scam-pop{top:50%;width:min(78%,360px);padding:16px 18px;}
.anim-dock{display:flex;align-items:center;gap:14px;padding:12px 14px 14px;background:var(--surface);border-top:2px solid var(--line);flex:0 0 auto;}
.anim-dock .pip-fly{position:static;flex:0 0 auto;line-height:0;}
.anim-dock .anim-caption{position:relative;left:auto;right:auto;bottom:auto;flex:1 1 auto;margin:0 0 0 4px;padding:11px 15px;font-size:18px;border-radius:16px;background:var(--t-explore-soft);border:2px solid var(--t-explore);color:var(--ink);}
.anim-dock .anim-caption::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--t-explore-soft);border-left:2px solid var(--t-explore);border-bottom:2px solid var(--t-explore);transform:translateY(-50%) rotate(45deg);}
.anim-dock .trash-zone{position:static;right:auto;bottom:auto;transform:none;flex:0 0 auto;width:190px;min-height:130px;font-size:19px;line-height:1.2;border-width:4px;border-radius:22px;}
.anim-dock .trash-zone .bin-icon{display:block;font-size:48px;line-height:1;margin-bottom:6px;}
.anim-dock .trash-zone.hot{transform:scale(1.08);}
@media(max-width:560px){
  .anim-scene{min-height:0;}
  .anim-stage{height:240px;}
  .anim-stage .scam-pop{width:88%;padding:12px 12px 14px;}
  .anim-stage .scam-pop .gift{font-size:32px;}
  .anim-stage .scam-pop .free{font-size:clamp(17px,5.6vw,22px);margin:4px 0;white-space:nowrap;}
  .anim-stage .scam-pop .urgent{font-size:clamp(12px,3.8vw,15px);white-space:nowrap;}
  .anim-stage .scam-pop .clicky{margin-top:8px;padding:7px 16px;font-size:15px;}
  .anim-dock{flex-wrap:wrap;}
  .anim-dock .anim-caption{flex:1 1 0;font-size:16px;}
  .anim-dock .trash-zone{width:100%;min-height:110px;}
  .anim-dock .trash-zone.hot{transform:scale(1.03);}
}
@media(prefers-reduced-motion:reduce){.scam-pop,.pip-fly,.anim-caption,.free,.urgent,.chat-avatar,.fly-card,.stranger,.password-key{animation:none!important}.scam-pop,.anim-caption,.pip-fly{opacity:1}.scam-pop{transform:translate(-50%,-50%)}}
</style>

["explore","squad","crew"].forEach(function(k){
  var b = TRACKS[k], w = {};
  b.base = k; b.world = 1;
  for(var prop in b){ if(b.hasOwnProperty(prop)) w[prop] = b[prop]; }
  w.key = k + "2"; w.world = 2; w.levels = WORLD2[k];
  TRACKS[k + "2"] = w;
});
function baseOf(k){ var t = TRACKS[k]; return t ? (t.base || t.key) : String(k || "").replace(/2$/, ""); }
function isKid(k){ return baseOf(k || S.track) === "explore"; }
function worldName(t){ return "Level " + (t.world || 1); }


/* ---------------------------------------------------------------
   STATE
----------------------------------------------------------------*/
var S = { track:null, idx:0, score:0, tries:0, streak:0, noHint:true, answered:false, order:[] };
var cameFrom = "home";   // which screen opened the grown-ups panel

function load(){
  try{ return JSON.parse(localStorage.getItem("scamsquad") || "{}"); }
  catch(e){ return {}; }
}
function save(data){
  try{ localStorage.setItem("scamsquad", JSON.stringify(data)); }catch(e){}
}
function progress(k){
  var d = load();
  return (d[k] && typeof d[k].done === "number") ? d[k] : {done:0, best:0, clean:false};
}
function setProgress(k, obj){
  var d = load(); d[k] = obj; save(d);
}

/* ---------------------------------------------------------------
   SCREENS
----------------------------------------------------------------*/
var elHome = document.getElementById("screen-home");
var elGame = document.getElementById("screen-game");
var elFin  = document.getElementById("screen-finish");
var elGrown= document.getElementById("screen-grown");
var btnHome= document.getElementById("btn-home");
var btnGrown=document.getElementById("btn-grown");

function show(which){
  [elHome, elGate, elGame, elFin, elGrown].forEach(function(e){ e.hidden = true; });
  which.hidden = false;
  btnHome.hidden = (which === elHome);
  window.scrollTo({top:0, behavior:"instant"});
}

function renderHome(){
  document.body.removeAttribute("data-track");

  var keys = ["explore","squad","crew","explore2","squad2","crew2"];
  var tot = {stars:0, tracks:0, badges:0};
  keys.forEach(function(k){
    var pr = progress(k);
    tot.stars += (pr.best || 0);
    if(pr.done >= TRACKS[k].levels.length){ tot.tracks++; tot.badges++; }
    if(pr.clean){ tot.badges++; }
  });

  var trophies = tot.stars > 0
    ? '<div class="trophies">'
      + '<div class="t"><div class="em">&#11088;</div><b>'+tot.stars+'</b><span>Points</span></div>'
      + '<div class="t"><div class="em">&#127891;</div><b>'+tot.tracks+'/3</b><span>Tracks done</span></div>'
      + '<div class="t"><div class="em">&#127942;</div><b>'+tot.badges+'</b><span>Badges</span></div>'
      + '</div>'
    : '';

  elHome.innerHTML =
      '<div class="hero2">'
    +   '<div class="crew-row">'
    +     '<span class="m">'+mascot("explore",78)+'</span>'
    +     '<span class="m">'+mascot("squad",92)+'</span>'
    +     '<span class="m">'+mascot("crew",78)+'</span>'
    +   '</div>'
    +   '<h1>Can you <em>spot the trick</em>?</h1>'
    +   '<p class="sub">Real tricks from games and chats. Spot the clues, beat the trick, collect badges. '
    +   'Nobody can lose. Get one wrong and you get a clue and another go.</p>'
    +   '<div class="chips"><span>&#128302; '+(TRACKS.explore.levels.length+TRACKS.squad.levels.length+TRACKS.crew.levels.length+TRACKS.explore2.levels.length+TRACKS.squad2.levels.length+TRACKS.crew2.levels.length)+' puzzles</span><span>&#9889; No losing</span><span>&#128274; No sign-up</span><span>&#127942; Certificates</span></div>'
    + '</div>'

    + trophies

    + '<div class="askage">'
    +   '<h2>How old are you?</h2>'
    +   '<p>So we show you the right puzzles.</p>'
    +   '<div class="agepick">'
    +     '<button data-age="explore" aria-pressed="false"><span class="big-n">6&ndash;9</span><span class="lil">Explorers</span></button>'
    +     '<button data-age="squad" aria-pressed="false"><span class="big-n">10&ndash;13</span><span class="lil">Squad</span></button>'
    +     '<button data-age="crew" aria-pressed="false"><span class="big-n">14&ndash;18</span><span class="lil">Crew</span></button>'
    +   '</div>'
    +   '<button class="grownlink" id="imgrown">I&rsquo;m a parent or teacher</button>'
    + '</div>'

    + '<div id="reveal"></div>'

    + '<div class="homenote"><strong>Grown-ups:</strong> no name, no email, no sign-up, and nothing is sent to any server. '
    + 'Progress stays in this browser. Tap <strong>I&rsquo;m a parent or teacher</strong> for what each track covers, '
    + 'the lesson plans, and where the facts come from.</div>';

  var picks = elHome.querySelectorAll(".agepick button");
  picks.forEach(function(b){
    b.addEventListener("click", function(){
      picks.forEach(function(o){ o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
      revealTrack(b.getAttribute("data-age"));
    });
  });
  document.getElementById("imgrown").addEventListener("click", function(){
    cameFrom = "home"; renderGrown();
  });
  show(elHome);
}

// Tracks are hidden until an age is chosen, so a younger child never
// reads the teen track's description on the way in.
function revealTrack(k){
  var t = TRACKS[k];
  var open2 = level2Open(k);
  function levelBtn(key, n, desc){
    var tt = TRACKS[key], pr = progress(key);
    var locked = (n === 2 && !open2);
    var done = pr.done >= tt.levels.length;
    var pct = Math.round(Math.min(pr.done, tt.levels.length) / tt.levels.length * 100);
    var label = locked ? "Finish Level 1 to unlock"
      : pr.done === 0 ? tt.levels.length + " missions"
      : done ? "Finished &#10003; &nbsp;best " + pr.best + " " + tt.unit
      : pr.done + " of " + tt.levels.length + " done";
    var cta = locked ? "&#128274;" : pr.done === 0 ? "Let&rsquo;s go &rarr;" : (done ? "Play again &rarr;" : "Keep going &rarr;");
    return '<button class="world'+(done ? " done" : "")+(locked ? " locked" : "")+'" data-key="'+key+'"'
      + (locked ? ' aria-disabled="true"' : '') + '>'
      + '<span class="wtop"><span class="wnum">'+(locked ? '&#128274; ' : '')+'Level '+n+'</span></span>'
      + '<span class="wdesc">'+desc+'</span>'
      + (locked ? '' : '<span class="bar2"><i style="width:'+pct+'%"></i></span>')
      + '<span class="wfoot"><span class="prog2">'+label+'</span><span class="wcta">'+cta+'</span></span>'
      + '</button>';
  }
  document.getElementById("reveal").innerHTML =
      '<div class="revealcard '+k+'">'
    +   '<div class="art">'+mascot(k,118)+'</div>'
    +   '<div class="body">'
    +     '<span class="age2">'+t.age+'</span>'
    +     '<h3>'+t.name+'</h3>'
    +     '<p>'+t.tagline+'</p>'
    +     '<div class="worlds'+(open2 ? " w1done" : "")+'">'
    +       levelBtn(k, 1, WORLD_DESC[k][0]) + levelBtn(k + "2", 2, WORLD_DESC[k][1])
    +     '</div>'
    +     '<div class="lockmsg" id="lockmsg" role="status"></div>'
    +   '</div>'
    + '</div>'
    + '<button class="switchlink" id="wrongage">That is not my age. Pick again</button>';

  document.querySelectorAll("#reveal .world").forEach(function(btn){
    btn.addEventListener("click", function(){
      if(btn.classList.contains("locked")){
        btn.classList.remove("nope"); void btn.offsetWidth; btn.classList.add("nope");
        document.getElementById("lockmsg").textContent = "Level 2 opens when you finish Level 1. You can do it!";
        return;
      }
      goWorld(btn.getAttribute("data-key"));
    });
  });
  document.getElementById("wrongage").addEventListener("click", function(){
    document.getElementById("reveal").innerHTML = "";
    elHome.querySelectorAll(".agepick button").forEach(function(o){ o.setAttribute("aria-pressed","false"); });
    document.querySelector(".askage").scrollIntoView({block:"center", behavior:"smooth"});
  });
  document.querySelector(".revealcard").scrollIntoView({block:"center", behavior:"smooth"});
}

/* Level 2 opens once Level 1 of the same age group is finished. Progress is
   saved on the device, and also remembered for this visit, so a browser that
   blocks saving still opens Level 2 straight after Level 1. A grown-up can open
   it from the grown-ups panel, for shared school devices or cleared browsers. */
var UNLOCKED = {};
function level2Open(k){
  k = baseOf(k);
  if(UNLOCKED[k]) return true;
  if(progress(k).done >= TRACKS[k].levels.length) return true;
  try{ return !!(load().unlock2 || {})[k]; }catch(e){ return false; }
}
function unlockLevel2(k, remember){
  UNLOCKED[k] = true;
  if(remember){ try{ var d = load(); d.unlock2 = d.unlock2 || {}; d.unlock2[k] = true; save(d); }catch(e){} }
}

// The 14 to 18 check is asked once per visit, whichever world is picked first.
function goWorld(key){
  if(/2$/.test(key) && !level2Open(key)){ revealTrack(baseOf(key)); return; }
  if(baseOf(key) === "crew" && !S.gatePassed){ renderGate(key); }
  else { startTrack(key); }
}

function startTrack(k){
  S.track = k; S.idx = 0; S.score = 0; S.streak = 0; S.noHint = true;
  document.body.setAttribute("data-track", baseOf(k));
  renderLevel();
}

function renderLevel(){
  var t = TRACKS[S.track];
  var L = t.levels[S.idx];
  S.tries = 0; S.answered = false;

  // Interactive mini-game levels for the 6-9 track.
  if(L.type === "animatedPopup"){ renderAnimatedPopup(t, L); return; }
  if(L.type === "animatedSort"){ renderAnimatedSort(t, L); return; }
  if(L.type === "animatedVault"){ renderAnimatedVault(t, L); return; }
  if(L.type === "spot"){ renderSpot(t, L); return; }
  if(L.type === "sort"){ renderSort(t, L); return; }
  if(L.type === "vault"){ renderVault(t, L); return; }
  if(L.type === "tools"){ renderTools(t, L); return; }
  if(L.type === "alarm"){ renderAlarm(t, L); return; }
  if(L.type === "photo"){ renderPhoto(t, L); return; }
  if(L.type === "boss"){ renderBoss(t, L); return; }

  // Mockup levels for the 10-13 and 14-18 tracks.
  if(L.type === "inspect"){ renderInspect(t, L); return; }
  if(L.type === "triage"){ renderTriage(t, L); return; }
  if(L.type === "order"){ renderOrder(t, L); return; }

  var steps = t.levels.map(function(_, i){
    return '<i class="'+(i < S.idx ? "done" : (i === S.idx ? "now" : ""))+'"></i>';
  }).join("");

  // Shuffle option order every time so the answer is never in a fixed slot.
  S.order = L.opts.map(function(_, i){ return i; });
  for(var z = S.order.length - 1; z > 0; z--){
    var r = Math.floor(Math.random() * (z + 1));
    var tmp = S.order[z]; S.order[z] = S.order[r]; S.order[r] = tmp;
  }

  var opts = S.order.map(function(srcIdx, i){
    var o = L.opts[srcIdx];
    return '<button class="opt" data-i="'+i+'">'

function answer(i){

    var pts = S.tries === 0 ? 100 : 60;
    if(S.tries === 0){ S.streak++; if(S.streak >= 3){ pts += 25; } } else { S.streak = 0; }
    var before = S.score;
    S.score += pts;

    btns.forEach(function(b, n){ b.disabled = true; if(n === i){ b.classList.add("picked-good"); } });
    var hudScore = elGame.querySelector(".hud .stat b");
    if(hudScore && isKid()){ celebrateStars(hudScore, before, S.score); }

    reply.innerHTML = '<h3>'+L.win+'</h3>'
      + '<p>+'+pts+' '+t.unit+' '+t.uniticon+(S.streak>=3?' &nbsp;<b>'+S.streak+' in a row!</b>':'')+'</p>'

    document.getElementById("next").focus();

function tapPart(i){
  if(S.answered) return;
  var t = TRACKS[S.track], L = t.levels[S.idx];
  var p = L.parts[i];
  var btn = elGame.querySelector('.part[data-i="'+i+'"]');
  var reply = document.getElementById("reply");
  var total = L.parts.filter(function(x){ return x.clue; }).length;

  if(btn.classList.contains("found")) return;   // already tapped this trick

  if(p.clue){
    // A trick. Turn it green, say why, count it.
    btn.classList.add("found");
    S.found++;
    document.getElementById("foundcount").textContent = S.found+" of "+total+" tricks found";
    reply.className = "reply win show";
    reply.innerHTML = '<h3>Yes, that is a trick</h3><p>'+p.why+'</p>';
    beep(true);

    if(S.found === total){
      // All tricks found. Same scoring as the other levels.
      S.answered = true;
      var pts = S.tries === 0 ? 100 : 60;
      if(S.tries === 0){ S.streak++; if(S.streak >= 3){ pts += 25; } } else { S.streak = 0; }
      S.score += pts;
      var hudScore = elGame.querySelector(".hud .stat b");
      if(hudScore){ hudScore.textContent = S.score; }
      elGame.querySelectorAll(".part").forEach(function(b){ b.disabled = true; });
      reply.innerHTML = '<h3>'+L.win+'</h3>'
        + '<p>+'+pts+' '+t.unit+' '+t.uniticon+(S.streak>=3?' &nbsp;<b>'+S.streak+' in a row!</b>':'')+'</p>'
        + whyHtml(L)
        + '<div class="nextrow"><button class="big" id="next">'
        + (S.idx+1 < t.levels.length ? "Next level &rarr;" : "See your badges &rarr;")+'</button></div>';
      document.getElementById("next").addEventListener("click", nextLevel);
      document.getElementById("next").focus();
    }
  } else {
    // A normal part. Wobble it, give a clue, no penalty.
    S.tries++;
    S.noHint = false;
    btn.classList.remove("nope"); void btn.offsetWidth; btn.classList.add("nope");
    reply.className = "reply hint show";
    reply.innerHTML = '<h3>Not that one. Here is a clue</h3><p>'+p.hint+'</p>'
      + '<p style="font-weight:700">Keep looking. You keep everything you have earned.</p>';
    beep(false);
  }
  reply.scrollIntoView({block:"nearest", behavior:"smooth"});
}


/* Explorers (6 to 9) get a bigger, louder header. The star count is the
   first thing on the left and the missions are a trail of stops, so a young
   player can see how far they have come without reading anything. */
function kidHud(t){
  var trail = t.levels.map(function(_, i){
    if(i < S.idx) return '<i class="done" aria-hidden="true">&#11088;</i>';
    if(i === S.idx) return '<i class="now" aria-hidden="true">'+(i+1)+'</i>';
    return '<i aria-hidden="true">'+(i+1)+'</i>';
  }).join('<span class="link" aria-hidden="true"></span>');
  return '<div class="hud hud-kid">'
    + '<div class="stat jar" aria-label="'+S.score+' stars"><span class="jar-star" aria-hidden="true">&#11088;</span><b id="starCount">'+S.score+'</b><span class="jar-label">stars</span></div>'
    + '<div class="trail" role="img" aria-label="Mission '+(S.idx+1)+' of '+t.levels.length+'">'+trail+'</div>'
    + '<div class="buddy kid-buddy">'+mascot(S.track,52)+'</div>'
    + '</div>';
}
/* The star jar counts up, bumps, and a "+100" floats off it. With reduced
   motion switched on the number simply changes. */
function celebrateStars(el, from, to){
  var jar = el.closest(".jar");
  var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(jar) jar.setAttribute("aria-label", to+" stars");
  if(calm){ el.textContent = to; return; }
  var t0 = null, dur = 700;
  function step(ts){
    if(!t0) t0 = ts;
    var k = Math.min(1, (ts - t0) / dur);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    if(k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // Browsers pause animation frames in background tabs, which can freeze the
  // count partway. This makes sure the real total always lands.
  setTimeout(function(){ el.textContent = to; }, dur + 120);
  if(jar){
    jar.classList.remove("bump"); void jar.offsetWidth; jar.classList.add("bump");
    var f = document.createElement("span");
    f.className = "jar-float"; f.textContent = "+" + (to - from);
    jar.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 1200);
  }
}

function makeDraggable(node, targets, onDrop){
  var startX=0,startY=0,baseX=0,baseY=0,drag=false;
  function pointIn(el,x,y){var r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}
  // Young children often let go with the item over the target but their finger
  // just outside it. Count a drop when the finger is inside the target, or when
  // the dragged item covers a good part of it. With two targets, the one it
  // covers most wins.
  function overlap(a,b){var w=Math.min(a.right,b.right)-Math.max(a.left,b.left),h=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);return (w>0&&h>0)?w*h:0;}
  function bestTarget(e){
    var nr=node.getBoundingClientRect(), best=null, bestScore=0;
    targets.forEach(function(t){
      var tr=t.getBoundingClientRect(), area=Math.max(1,tr.width*tr.height);
      var score=pointIn(t,e.clientX,e.clientY)?2:overlap(nr,tr)/area;
      if(score>=0.35&&score>bestScore){best=t;bestScore=score;}
    });
    return best;
  }
  // z is how much the zoom control is scaling the page. Pointer positions are
  // in screen pixels but left and top are in page pixels, so divide by z or
  // the dragged item drifts away from the finger when zoomed.
  var z=1;
  node.addEventListener("pointerdown",function(e){
    if(S.answered)return; drag=true; node.setPointerCapture(e.pointerId); node.classList.add("dragging");
    var r=node.getBoundingClientRect(); startX=e.clientX; startY=e.clientY; baseX=r.left; baseY=r.top;
    // Measure on the container, not the item, because the item may be mid-animation and scaled.
    var ref=node.parentElement||node; z=(ref.offsetWidth>0)?(ref.getBoundingClientRect().width/ref.offsetWidth):1; if(!(z>0.2&&z<5))z=1;
    node.style.position="fixed"; node.style.left=(baseX/z)+"px"; node.style.top=(baseY/z)+"px"; node.style.transform="none"; node.style.margin="0"; node.style.width=(r.width/z)+"px"; node.style.zIndex="999";
  });
  node.addEventListener("pointermove",function(e){
    if(!drag)return; node.style.left=((baseX+e.clientX-startX)/z)+"px"; node.style.top=((baseY+e.clientY-startY)/z)+"px";
    var best=bestTarget(e); targets.forEach(function(t){t.classList.toggle("hot",t===best);});
  });
  function end(e){
    if(!drag)return; drag=false; try{node.releasePointerCapture(e.pointerId)}catch(_e){} node.classList.remove("dragging");
    var hit=bestTarget(e); targets.forEach(function(t){t.classList.remove("hot");});
    if(hit){onDrop(hit,node);} else {node.removeAttribute("style");}
  }
  node.addEventListener("pointerup",end); node.addEventListener("pointercancel",function(){drag=false;node.classList.remove("dragging");targets.forEach(function(t){t.classList.remove("hot")});node.removeAttribute("style");});
}
