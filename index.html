/* ---------- inspect: a realistic mockup, find the giveaways, then decide ----------
   The mockup is built from L.mock, a list of chunks joined in order. A chunk
   with tell:true is a giveaway the player has to find. A chunk that starts with
   a tag is a whole block (a chat bubble, a row); add inline:true to make a tag
   chunk sit inside a sentence instead. Nothing here is a working script, only
   the shape of one, so the level teaches recognition without handing anyone a
   method.

   Once every giveaway is found, levels with L.opts move on to "what do you do?",
   which uses the same answer() as the multiple-choice levels. That keeps the
   lesson the project cares about most, which is telling an adult. */
function buildMock(L){
  function chunk(part, i){
    if(!part.tell) return part.t;
    var block = !part.inline && !part.bar && part.t.charAt(0) === "<";
    var tag = block ? "div" : "span";
    return '<'+tag+' class="tell'+(block ? " tell-block" : "")+'" role="button" tabindex="0" data-i="'+i+'">'+part.t+'</'+tag+'>';
  }
  // Chunks marked bar:true belong in the web address bar, not the page.
  var inner = "", addr = "";
  L.mock.forEach(function(part, i){ if(part.bar) addr += chunk(part, i); else inner += chunk(part, i); });
  var f = L.frame || "chat";
  // Real game and app names appear as plain text only. No logos, on purpose:
  // they are trademarks, and a real logo on a fake scam screen looks like the
  // impersonation the game is teaching kids to spot.
  var chip = L.game ? '<span class="gamechip">'+L.game+'</span>' : '';
  var th = L.theme ? ' theme-'+L.theme : '';
  if(f === "chat" || f === "group"){
    var head = '<div class="device-bar"><span class="dot"></span><span class="who">'+L.from+'<small>'+(L.fromSub||"")+'</small></span>'+chip+'</div>';
    return '<div class="device device-'+f+th+'">'+head+'<div class="chatwrap">'+inner+'</div></div>';
  }
  if(f === "site"){
    var bar = '<div class="urlbar"><span class="lock" aria-hidden="true">&#127760;</span><span class="addr">'+(addr || L.url || "")+'</span>'+chip+'</div>';
    return '<div class="device device-site'+th+'">'+bar+'<div class="sitebox">'+inner+'</div></div>';
  }
  if(f === "email"){
    var mtop = '<div class="device-bar app-bar"><span class="who">'+L.from+'<small>'+(L.fromSub||"")+'</small></span>'+chip+'</div>';
    return '<div class="device device-email'+th+'">'+mtop+'<div class="mailbody">'+inner+'</div></div>';
  }
  if(f === "app"){
    var top = '<div class="device-bar app-bar"><span class="who">'+L.from+'<small>'+(L.fromSub||"")+'</small></span>'+chip+'</div>';
    return '<div class="device device-app'+th+'">'+top+'<div class="appbody">'+inner+'</div></div>';
  }
  return '<div class="device"><div class="chatwrap">'+inner+'</div></div>';
}

/* Explanations: the bold first line is the takeaway and always shows. The rest
   sits behind a "Why?" tap, so a young player is not faced with a paragraph.
   Levels with whyOpen:true show everything, for when the detail is the help
   (reporting routes, or a how-it-works list). */
function whyHtml(L){
  var w = L.why || "";
  if(isKid()) return '<div class="why">'+w+'</div>';
  var m = w.match(/^\s*(<b>[\s\S]*?<\/b>)\s*([\s\S]*)$/);
  if(!m || !m[2].replace(/<[^>]+>/g, "").trim()) return '<div class="why">'+w+'</div>';
  return '<div class="why"><p class="take">'+m[1]+'</p>'
    + '<details class="more"'+(L.whyOpen ? ' open' : '')+'><summary>Why?</summary><div class="more-body">'+m[2]+'</div></details></div>';
}

/* "Show me a clue" lights up the next thing to find. Nobody can lose, so nobody
   should get stuck hunting for a small target on a phone. Using it gives up the
   clue-free badge, which is fair. */
function showClue(sel, done){
  var next = document.querySelector(sel);
  if(!next) return;
  S.noHint = false;
  document.querySelectorAll(".hintme").forEach(function(x){ x.classList.remove("hintme"); });
  next.classList.add("hintme");
  next.scrollIntoView({block:"center", behavior:"smooth"});
  var m = document.getElementById("tellmsg");
  if(m) m.textContent = done || "Look at the glowing part!";
  setTimeout(function(){ next.classList.remove("hintme"); }, 4000);
}

/* ---------- order: put the right steps in the right order ----------
   Each step has a rank. A step can be placed once every lower-ranked step is
   in, so steps that can happen in any order share a rank. Wrong steps (no rank)
   are explained and greyed out. Nobody can lose. */
function renderOrder(t, L){
  S.answered = false; S.placed = 0;
  var good = L.steps.filter(function(x){ return x.rank; });
  good.forEach(function(x){ delete x.done; });
  var slots = good.map(function(_, i){ return '<li class="oslot" id="oslot'+i+'"><span class="onum">'+(i+1)+'</span><span class="otext">&nbsp;</span></li>'; }).join("");
  var order = shuffledOrder(L.steps.length);
  var btns = order.map(function(src){
    return '<button class="ostep" data-i="'+src+'">'+L.steps[src].t+'</button>';
  }).join("");
  miniShell(t, L, '<div class="orderbox">'
    + (L.situation ? '<div class="osit">'+L.situation+'</div>' : '')
    + '<div class="oplan"><div class="olabel">'+(L.planLabel || "Your plan")+'</div><ol class="oslots">'+slots+'</ol></div>'
    + '<div class="olabel">'+(L.pickLabel || "Tap the steps in order")+'</div><div class="osteps">'+btns+'</div>'
    + '<div class="microfeedback" id="micro">'+(L.prompt || "What comes first?")+'</div></div>');
  function nextRank(){
    var left = good.filter(function(x){ return !x.done; });
    return left.length ? Math.min.apply(null, left.map(function(x){ return x.rank; })) : null;
  }
  elGame.querySelectorAll(".ostep").forEach(function(b){
    b.addEventListener("click", function(){
      if(S.answered || b.disabled) return;
      var st = L.steps[+b.dataset.i], m = document.getElementById("micro");
      if(!st.rank){
        b.disabled = true; b.classList.add("onope");
        m.className = "microfeedback warn"; m.textContent = st.why; beep(false); return;
      }
      if(st.rank !== nextRank()){
        b.classList.remove("owait"); void b.offsetWidth; b.classList.add("owait");
        m.className = "microfeedback warn"; m.textContent = L.notYet || "Good step, but not yet. What has to happen first?"; beep(false); return;
      }
      st.done = true;
      var slot = document.getElementById("oslot"+S.placed);
      slot.querySelector(".otext").innerHTML = st.t; slot.classList.add("ofill");
      S.placed++;
      b.disabled = true; b.classList.add("oused");
      m.className = "microfeedback good"; m.textContent = st.why; beep(true);
      if(S.placed === good.length){
        good.forEach(function(x){ delete x.done; });
        setTimeout(function(){ miniWin(t, L, 100); }, 600);
      }
    });
  });
}
function shuffledOrder(n){
  var o = []; for(var i = 0; i < n; i++) o.push(i);
  for(var z = o.length - 1; z > 0; z--){ var r = Math.floor(Math.random() * (z + 1)); var tmp = o[z]; o[z] = o[r]; o[r] = tmp; }
  return o;
}
function showDecide(t, L){
  if(!L.opts){ miniWin(t, L, 100); return; }
  if(document.getElementById("decide")) return;
  S.order = shuffledOrder(L.opts.length);
  var opts = S.order.map(function(src, i){
    var o = L.opts[src];
    return '<button class="opt" data-i="'+i+'"><span class="key" aria-hidden="true">'+String.fromCharCode(65+i)+'</span>'
      + '<span class="otxt"><b>'+o.t+'</b>'+(o.d ? '<span>'+o.d+'</span>' : '')+'</span></button>';
  }).join("");
  var box = document.createElement("div");
  box.id = "decide"; box.className = "decide";
  box.innerHTML = '<div class="decide-ask">'+(L.decideAsk || "You spotted it. Now, what do you do?")+'</div><div class="opts">'+opts+'</div>';
  var reply = document.getElementById("reply");
  reply.parentNode.insertBefore(box, reply);
  box.querySelectorAll(".opt").forEach(function(b){
    b.addEventListener("click", function(){ answer(parseInt(b.getAttribute("data-i"), 10)); });
  });
  box.scrollIntoView({block:"nearest", behavior:"smooth"});
}
function renderInspect(t, L){
  S.answered = false; S.found = 0;
  var total = L.mock.filter(function(p){ return p.tell; }).length;
  function pips(n){
    var out = "";
    for(var i = 0; i < total; i++) out += '<i class="'+(i < n ? "on" : "")+'"></i>';
    return out;
  }
  var bar = total
    ? '<div class="tellbar" aria-live="polite"><span id="tellmsg">'+(L.prompt || "Tap everything that looks wrong.")+'</span><span class="pips" id="tellpips">'+pips(0)+'</span>'
      + '<button class="cluebtn" id="cluebtn" type="button">&#128161; Show me a clue</button></div>'
    : '';
  miniShell(t, L, buildMock(L) + bar);
  if(!total){ showDecide(t, L); return; }
  var cb = document.getElementById("cluebtn");
  if(cb) cb.addEventListener("click", function(){ showClue(".tell:not(.got)"); });
  elGame.querySelectorAll(".tell").forEach(function(btn){
    btn.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); btn.click(); }
    });
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if(btn.classList.contains("got")) return;
      var part = L.mock[+btn.dataset.i];
      btn.classList.add("got");
      S.found++;
      document.getElementById("tellmsg").innerHTML = part.why;
      document.getElementById("tellpips").innerHTML = pips(S.found);
      beep(true);
      if(S.found === total){
        var cbx = document.getElementById("cluebtn"); if(cbx) cbx.hidden = true;
        setTimeout(function(){
          var m = document.getElementById("tellmsg");
          if(m) m.innerHTML = "<b>All "+total+" found.</b> "+part.why;
          showDecide(t, L);
        }, 500);
      }
    });
  });
  // Tapping a normal part costs nothing. It just says why that part is fine.
  elGame.querySelectorAll(".chatwrap, .sitebox, .appbody, .mailbody").forEach(function(box){
    box.addEventListener("click", function(e){
      if(S.found === total || e.target.closest(".tell")) return;
      document.getElementById("tellmsg").textContent = L.safeHint || "That part looks normal. Keep looking.";
    });
  });
}

/* ---------- triage: several real-looking messages, only some are scams ---------- */
function renderTriage(t, L){
  S.answered = false; S.found = 0;
  var scams = L.cards.filter(function(c){ return c.scam; }).length;
  var cards = L.cards.map(function(c, i){
    return '<button class="tcard'+(c.theme ? ' tc-'+c.theme : '')+'" data-i="'+i+'">'
      + '<span class="thead">'+c.icon+' '+c.from+'</span>'
      + '<span class="tbody">'+c.body+'</span>'
      + '<span class="verdict"></span></button>';
  }).join("");
  miniShell(t, L, '<div class="triage">'+cards+'</div>'
    + '<div class="tellbar" aria-live="polite"><span id="tellmsg">'+(L.prompt || "Tap the ones that are scams.")+'</span>'
    + '<button class="cluebtn" id="cluebtn" type="button">&#128161; Show me a clue</button></div>');
  var cbt = document.getElementById("cluebtn");
  if(cbt) cbt.addEventListener("click", function(){
    var left = [].filter.call(document.querySelectorAll(".tcard"), function(b){
      return L.cards[+b.dataset.i].scam && !b.classList.contains("scam");
    });
    if(left[0]){ left[0].classList.add("cluepick"); showClue(".tcard.cluepick:not(.scam)"); left[0].classList.remove("cluepick"); }
  });
  elGame.querySelectorAll(".tcard").forEach(function(btn){
    btn.addEventListener("click", function(){
      if(S.found === scams || btn.classList.contains("scam") || btn.classList.contains("safe")) return;
      var c = L.cards[+btn.dataset.i];
      btn.querySelector(".verdict").textContent = c.why;
      document.getElementById("tellmsg").textContent = c.why;
      if(c.scam){
        btn.classList.add("scam"); S.found++; beep(true);
        if(S.found === scams){ var cbz = document.getElementById("cluebtn"); if(cbz) cbz.hidden = true; setTimeout(function(){ showDecide(t, L); }, 450); }
      } else {
        // Naming a safe message is not a failure. It is worth explaining.
        btn.classList.add("safe"); beep(false);
      }
    });
  });
}

function nextLevel(){
  var t = TRACKS[S.track];
  S.idx++;
  if(S.idx < t.levels.length){ renderLevel(); }
  else { finish(); }
}

----------------------------------------------------------------*/
function printEl(el, note){
  if(!el) return;
  el.classList.add("printnow");
  try{ window.print(); }catch(e){}
  setTimeout(function(){ el.classList.remove("printnow"); }, 900);

// Clipboard without relying on the async API, which is often blocked
// when the page is embedded.
function copyText(txt, btn){
  var ta = document.createElement("textarea");
  ta.value = txt;
  ta.setAttribute("readonly","");
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, txt.length);
  var ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){}, function(){});
    ok = true;
  }
  var was = btn.textContent;
  btn.textContent = ok ? "Copied \u2713" : "Couldn\u2019t copy. Select it by hand";
  setTimeout(function(){ btn.textContent = was; }, 2400);
}

/* ---------------------------------------------------------------
   CERTIFICATE AS AN IMAGE
   Downloads and print dialogs are blocked when the page is embedded,
   so the certificate is drawn to a canvas and shown as an image the
   viewer can long-press or right-click to save. Works everywhere.
----------------------------------------------------------------*/
function wrapLines(ctx, text, maxW){
  var words = text.split(" "), lines = [], line = "";
  for(var i=0;i<words.length;i++){
    var test = line ? line + " " + words[i] : words[i];
    if(ctx.measureText(test).width > maxW && line){ lines.push(line); line = words[i]; }
    else { line = test; }
  }
  if(line) lines.push(line);
  return lines;
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function drawCertImage(o){
  var W = 1100, H = 760, S = 2;
  var c = document.createElement("canvas");
  c.width = W*S; c.height = H*S;
  var ctx = c.getContext("2d");
  ctx.scale(S,S);
  var disp = '"Fredoka", "Trebuchet MS", sans-serif';
  var body = '"Nunito", "Segoe UI", sans-serif';

  ctx.fillStyle = "#FFFDF7"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = "#C9A227"; ctx.lineWidth = 8;
  roundRect(ctx, 14, 14, W-28, H-28, 22); ctx.stroke();
  ctx.strokeStyle = "#E0CE8E"; ctx.lineWidth = 3; ctx.setLineDash([9,9]);
  roundRect(ctx, 44, 44, W-88, H-88, 14); ctx.stroke(); ctx.setLineDash([]);

  ctx.textAlign = "center";
  ctx.fillStyle = "#9A7B12"; ctx.font = "600 19px " + disp;
  ctx.fillText("S C A M S Q U A D   A C A D E M Y", W/2, 118);

  ctx.fillStyle = "#221E38"; ctx.font = "700 44px " + disp;
  ctx.fillText(o.title, W/2, 180);

  ctx.fillStyle = "#4A4560"; ctx.font = "400 23px " + body;
  ctx.fillText("This certifies that", W/2, 240);

  ctx.fillStyle = "#3A2FBE"; ctx.font = "700 66px " + disp;
  var nm = o.name, size = 66;
  while(ctx.measureText(nm).width > W-220 && size > 30){
    size -= 3; ctx.font = "700 " + size + "px " + disp;
  }
  ctx.fillText(nm, W/2, 322);

  ctx.strokeStyle = "#E0CE8E"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(W/2-160, 360); ctx.lineTo(W/2+160, 360); ctx.stroke();

  ctx.fillStyle = "#4A4560"; ctx.font = "400 23px " + body;
  wrapLines(ctx, o.line, W-300).forEach(function(l,i){ ctx.fillText(l, W/2, 408 + i*34); });

  if(o.badges){
    ctx.fillStyle = "#221E38"; ctx.font = "600 21px " + body;
    wrapLines(ctx, "Badges earned: " + o.badges, W-280).forEach(function(l,i){
      ctx.fillText(l, W/2, 500 + i*30);
    });
  }

  ctx.strokeStyle = "#EFE4C0"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(90, 630); ctx.lineTo(W-90, 630); ctx.stroke();

  ctx.textAlign = "left";
  var cols = [[o.score,"Best score",100],[o.buddy,o.role,W/2-70],[o.date,"Date completed",W-330]];
  cols.forEach(function(col){
    ctx.fillStyle = "#221E38"; ctx.font = "600 25px " + disp;
    ctx.fillText(col[0], col[2], 674);
    ctx.fillStyle = "#6A6480"; ctx.font = "400 17px " + body;
    ctx.fillText(col[1], col[2], 702);
  });

  try{ return c.toDataURL("image/png"); }catch(e){ return null; }
}

  });
}

/* ---------------------------------------------------------------
   SOUND + CONFETTI (no assets, degrade silently)
----------------------------------------------------------------*/
var actx = null;
/* Sound and zoom settings. Kept on this device only, under their own key, and
   never sent anywhere. */
var PREFS = { mute:false, vol:3, zoom:2 };   // vol is 0 to 5, zoom is an index into ZOOMS
var ZOOMS = [0.8, 0.9, 1, 1.15, 1.3, 1.5];
(function loadPrefs(){
  try{
    var p = JSON.parse(localStorage.getItem("scamsquad-prefs") || "{}");
    if(typeof p.mute === "boolean") PREFS.mute = p.mute;
    if(p.vol >= 0 && p.vol <= 5) PREFS.vol = p.vol;
    if(p.zoom >= 0 && p.zoom < ZOOMS.length) PREFS.zoom = p.zoom;
  }catch(e){}
})();
function savePrefs(){ try{ localStorage.setItem("scamsquad-prefs", JSON.stringify(PREFS)); }catch(e){} }
function applyPrefs(){
  document.documentElement.style.setProperty("--ui-zoom", ZOOMS[PREFS.zoom]);
  var box = document.querySelector(".prefs"); if(!box) return;
  var silent = PREFS.mute || PREFS.vol === 0;
  box.classList.toggle("muted", silent);
  var m = document.getElementById("pf-mute");
  m.innerHTML = silent ? "&#128263;" : "&#128266;";
  m.setAttribute("aria-pressed", silent ? "true" : "false");
  m.setAttribute("aria-label", silent ? "Sound is off. Turn sound on" : "Sound is on. Turn sound off");
  document.querySelectorAll("#pf-meter i").forEach(function(b, i){ b.classList.toggle("on", i < PREFS.vol); });
  document.getElementById("pf-meter").setAttribute("aria-label", "Volume " + PREFS.vol + " of 5");
  document.getElementById("pf-voldown").disabled = PREFS.vol === 0;
  document.getElementById("pf-volup").disabled = PREFS.vol === 5;
  document.getElementById("pf-zoom").textContent = Math.round(ZOOMS[PREFS.zoom] * 100) + "%";
  document.getElementById("pf-zoomout").disabled = PREFS.zoom === 0;
  document.getElementById("pf-zoomin").disabled = PREFS.zoom === ZOOMS.length - 1;
}
function bindPrefs(){
  function on(id, fn){ var b = document.getElementById(id); if(b) b.addEventListener("click", function(){ fn(); savePrefs(); applyPrefs(); }); }
  on("pf-mute", function(){
    if(PREFS.vol === 0){ PREFS.vol = 3; PREFS.mute = false; }
    else { PREFS.mute = !PREFS.mute; }
    if(!PREFS.mute) setTimeout(function(){ beep(true, true); }, 0);
  });
  on("pf-voldown", function(){ if(PREFS.vol > 0) PREFS.vol--; PREFS.mute = false; setTimeout(function(){ beep(true, true); }, 0); });
  on("pf-volup", function(){ if(PREFS.vol < 5) PREFS.vol++; PREFS.mute = false; setTimeout(function(){ beep(true, true); }, 0); });
  on("pf-zoomout", function(){ if(PREFS.zoom > 0) PREFS.zoom--; });
  on("pf-zoomin", function(){ if(PREFS.zoom < ZOOMS.length - 1) PREFS.zoom++; });
  applyPrefs();
}

function beep(good, preview){
  try{
    if(PREFS.mute || PREFS.vol === 0) return;
    // Reduced motion used to silence everything. A child who turns the sound up
    // on purpose still gets the preview, so they can hear the new level.
    if(!preview && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if(!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); }
    var o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type = "sine";
    o.frequency.setValueAtTime(good ? 620 : 330, actx.currentTime);
    if(good){ o.frequency.exponentialRampToValueAtTime(940, actx.currentTime + 0.13); }
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    // Volume 3 of 5 matches the original loudness.
    g.gain.exponentialRampToValueAtTime(0.02 * PREFS.vol, actx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.22);
    o.start(); o.stop(actx.currentTime + 0.24);
  }catch(e){}
}

function burst(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var c = document.createElement("canvas");
  c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:99";
  c.width = innerWidth; c.height = innerHeight;
  document.body.appendChild(c);
  var ctx = c.getContext("2d");
  var cols = ["#4B3FE4","#E07C00","#0E7F94","#0E8F68","#FFD98A","#FF8FA3"];
  var bits = [];
  for(var i=0;i<110;i++){
    bits.push({x:innerWidth/2 + (Math.random()-0.5)*220, y:innerHeight*0.32,
      vx:(Math.random()-0.5)*9, vy:Math.random()*-11-3,
      s:5+Math.random()*7, c:cols[i%cols.length], r:Math.random()*6});
  }
  var frames = 0;
  (function tick(){
    ctx.clearRect(0,0,c.width,c.height);
    bits.forEach(function(b){
      b.x += b.vx; b.y += b.vy; b.vy += 0.34; b.r += 0.12;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.c; ctx.fillRect(-b.s/2,-b.s/2,b.s,b.s*0.6); ctx.restore();
    });
    frames++;
    if(frames < 130){ requestAnimationFrame(tick); } else { c.remove(); }
  })();
}
